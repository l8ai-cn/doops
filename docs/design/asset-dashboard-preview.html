    const choices = (key,label,pairs)=>`<label class="scope">${label} <select data-cl-filter="${key}">${pairs.map(([id,name])=>option(id,name,f[key])).join('')}</select></label>`;
    const controls = `<div class="toolbar">${choices('domain','资产范围',domains.map(d=>[d,d==='all'?'全部可见资产':domainName(d)]))}${choices('layer','关系层',Object.entries(layers))}${choices('mode','展示方式',[['graph','拓扑图'],['list','关系列表']])}<form class="toolbar" data-cl-form="search"><input type="search" name="query" aria-label="搜索节点" placeholder="名称、编号或命名空间" maxlength="100" value="${esc(f.query)}"><button>搜索</button></form>${btn('reset','','重置')}</div>`;
    const scopes = clusters.map(c=>href(url(c.id,'topology','all'),`${code(c.id)}${c.sources.some(s=>s.online)?'':' · 离线快照'} →`)).join('');
    let detail = '<h2>一跳关系</h2><p class="note foot">选择节点，查看它依赖的资源或受它影响的对象。</p>';
    if (selected) {
      const outgoing = f.direction==='out';
      const adjacent = links.map(e=>`<li><div>${pick(outgoing?e.to:e.from)}<small style="display:block">${esc(e.verb)} · ${evidenceText(e)}</small></div></li>`).join('');
      detail = info(selected,g) + `<div class="toolbar">${btn('direction','out','依赖谁 · 一跳',`aria-pressed="${outgoing}"`)}${btn('direction','in','影响谁 · 反向',`aria-pressed="${!outgoing}"`)}</div><p class="note foot">${outgoing?'出向':'反向'}关系 · ${links.length} 条</p>${adjacent?`<ul class="impact-list">${adjacent}</ul>`:empty('当前关系层与方向没有可见的一跳关系。')}${diagnostics(selected,g)}<p class="foot">${btn('clear-node','','返回筛选结果')}</p>`;
    }
    return `<div class="heading"><div><h1 tabindex="-1">平台拓扑</h1><p class="note">${Review.admin()?'平台可见资产':'我的授权范围'} · 关系箭头由起点指向关联对象</p></div></div><section class="panel">${controls}<div class="toolbar foot"><small>进入集群拓扑</small>${scopes}</div></section><div class="graph-layout"><section class="panel"><div class="graph-head"><h2>${f.mode==='graph'?'资产关系图':'资产关系列表'}</h2><small>${count} 个节点 · ${links.length} 条关系</small></div>${rendered?`<div style="display:grid;gap:12px">${rendered}</div>`:empty('当前筛选没有匹配的资产或关系。可调整范围、关系层或搜索词。')}</section><aside class="panel" aria-label="一跳关系">${detail}</aside></div>`;
  }

  function render(parts) {
    if (previousRole!==Review.admin()) {
      filters=defaults(); discovery=null; notice=''; previousRole=Review.admin();
    }
    const [id,view,scope,selection] = parts, clusters = inventory();
    if (id==='clusters' && parts.length===1) return clusterIndex(clusters);
    if (id==='topology' && parts.length===1) return platformTopology(clusters,graph(clusters));
    const c = clusters.find(entry=>entry.id===id);
    if (!c || (scope!=='all' && !namespaces(c).includes(scope))) return unavailable();
    const activity = c.id!==east && ['monitor','inspection'].includes(view);
    if ((!activity && !['overview','topology'].includes(view)) || parts.length>(view==='topology'?4:3) || selection==='') return unavailable();
    const g = graph(clusters);
    if (activity) return head(c,view,scope)+scopedActivity(c,view,scope,g);
    return head(c,view,scope) + (view==='overview'?overview(c,scope,g):clusterTopology(c,scope,selection,g));
  }
  document.addEventListener('submit',event=>{
    const form=event.target, kind=form.dataset.clForm;
    if (!kind) return;
    event.preventDefault();
    const data=Object.fromEntries(new FormData(form));
    if (kind==='search') { filters.query=data.query.trim(); filters.node=''; }
    if (kind==='discover') {
      if (!Review.admin() || !discovery) return;
      const draft=Object.fromEntries(Object.entries(data).map(([k,v])=>[k,v.trim()]));
      discovery={draft};
      try {discovery.preview=assess(draft,raw());} catch(err){discovery.error=err.message;}
    }
    Review.refresh();
  });
  document.addEventListener('change',event=>{
    const {clScope,clFilter}=event.target.dataset;
    if (clScope) location.hash=clScope+'/'+encodeURIComponent(event.target.value);
    if (clFilter) {
      filters[clFilter]=event.target.value;
      if (clFilter!=='mode') {filters.node=''; filters.direction='out';}
      Review.refresh();
    }
  });
  document.addEventListener('click',event=>{
    const el=event.target.closest?.('[data-cl-action]');
    if (!el || el.disabled) return;
    const action=el.dataset.clAction, value=el.value;
    if (action==='node') { filters.node=value; filters.direction='out'; }
    else if (action==='clear-node') filters.node='';
    else if (action==='reset') filters=defaults();
    else if (action==='direction') filters.direction=value;
    else {
      if (!Review.admin()) return;
      notice='';
      if (action==='discover') discovery={draft:{...template}};
      else if (action==='cancel') discovery=null;
      else if (action==='edit' && discovery) discovery.preview=null;
      else if (action==='commit' && discovery?.preview) commitDiscovery();
      else if (action==='verify') {
        const data=raw(), source=data.flatMap(c=>c.sources).find(s=>s.target===value);
        if (!source || !source.online) return;
        source.at=timestamp(); Review.save(store,data); Review.audit('重新核验集群来源',source.target);
        notice=`${source.target} 已重新核验 · ${source.at}（UTC+8）。`;
      }
    }
    const openSources = el.closest('details')?.querySelector('summary')?.textContent;
    Review.refresh();
    if (openSources) for (const d of document.querySelectorAll('details')) if (d.querySelector('summary')?.textContent===openSources) d.open=true;
  });
  return {render,list};
})();

</script>

<script>
'use strict';
window.Monitor = (() => {
  // All minute offsets refer to the same immutable example snapshot, in UTC+8.
  const end = Date.UTC(2026, 10, 19, 9, 40);
  const ranges = {'1h':60, '6h':360, '24h':1440, '7d':10080};
  const types = {cluster:'集群', machine:'机器', os:'操作系统', kernel:'内核', process:'进程', app:'应用程序', database:'数据库', alerts:'告警'};
  const metrics = {cpu:['CPU 用量','核'], memory:['内存用量','GiB'], gpu:['GPU 利用率','%'], network:['网络吞吐','MiB/s'], requests:['业务请求量','req/s'], storage:['存储已用','GiB']};
  const statuses = {open:'异常', recovered:'恢复', missing:'采集中断'};
  const nsLabels = {all:'全部可见命名空间', orders:'orders', 'shared-data':'shared-data', billing:'billing'};
  const source = ns => 'prod-east/agent-' + (ns === 'billing' ? 'b' : 'a');
  const visibleSpaces = () => Review.admin() ? ['orders','shared-data','billing'] : ['orders','shared-data'];
  // Baselines use cores, GiB, MiB/s, requests/s and GiB respectively. Null means inapplicable.
  const assets = [
    {type:'machine', ns:'orders', id:'SRV-001', name:'订单工作节点', info:'节点在线 · 16 核 / 64 GiB · 最近启动 11-16 06:18', base:[3.1,18,7.2,null,92], disk:512, gpu:true},
    {type:'os', ns:'orders', id:'OS-001', name:'Ubuntu 24.04 LTS', info:'安装于 SRV-001 · 启动周期 boot-a31 · 最近启动 11-16 06:18', base:[3.1,18,7.2,null,92], disk:512},
    {type:'kernel', ns:'orders', id:'KRN-001', name:'Linux 6.8.0', info:'运行于 OS-001 · 最近 24 小时 OOM 0 次 · CPU 为内核态用量', base:[0.31,0.85,null,null,null]},
    {type:'process', ns:'orders', id:'PID-4217', name:'order-api · PID 4217', info:'SRV-001 / boot-a31 / PID 4217 · 进程启动 11-16 06:23 · 内存为 RSS', base:[1.5,2.8,null,null,null]},
    {type:'app', ns:'orders', id:'APP-001', name:'order-api', info:'订单服务 · v2.8.1 · 2 个就绪副本 · P95 86 ms · 错误率 0.2%', base:[1.8,3.2,7.2,98,8], disk:32, gpu:true},
    {type:'database', ns:'shared-data', id:'DB-001', name:'shared-pg', info:'PostgreSQL 16 · 接受连接 · 34 个连接 · SQL 查询 162 次/秒', base:[0.7,3.3,2.1,null,80], disk:128},
    {type:'app', ns:'billing', id:'APP-002', name:'billing-api', info:'计费服务 · v1.9.0 · 1 个就绪副本 · P95 112 ms · 错误率 0.3%', base:[0.9,2.1,3.1,48,4], disk:16}
  ];
  const dimensions = ['cpu','memory','network','requests','storage'];
  const clock = (t, date = false) => new Date(end + t*60000).toISOString().slice(date ? 5 : 11,16).replace('T',' ');
  const num = n => Number(n.toFixed(2)).toString();
  const link = (type,ns='all',range='1h') => `#monitor/${type}/${ns}/${range}`;
  const options = (map,current) => Object.entries(map).map(([id,name]) => `<option value="${Review.esc(id)}"${id===current?' selected':''}>${Review.esc(name)}</option>`).join('');
  const jumpSelect = (label,map,current) => `<label class="scope">${label}<select onchange="location.hash=this.value">${options(map,current)}</select></label>`;
  const allowedAssets = () => {const spaces=visibleSpaces(); return assets.filter(a => spaces.includes(a.ns));};
  function sample(asset,key,t,channel=0) {
    if (key==='gpu') {
      if (channel===1 && t>=-12) return null;
      if (t>=-42 && t<=-38) return null;
      return Math.round(36 + 9*channel + 8*Math.sin(t/9) + 3*Math.cos(t/2));
    }
    if (key==='network' && ((t>=-41 && t<=-36) || (asset.ns==='billing' && t>=-8))) return null;
    const base = asset.base[dimensions.indexOf(key)];
    if (base===null) return null;
    const wave = Math.sin(t/12) + 0.4*Math.sin(t/2.9);
    let value = base*(1 + wave*(key==='requests' ? 0.012 : 0.065));
    if (key==='network') value *= (channel===1 ? 0.35 : 0.65)*(1 + Math.max(0, t+24)/36);
    if (key==='cpu' && asset.id==='APP-001' && ((t>=-32 && t<=-22) || (t>=-210 && t<=-196))) value=3.25+wave*0.1;
    if (key==='memory' && t>=-18) {
      const pressure = {'SRV-001':60, 'OS-001':60, 'PID-4217':10.8, 'APP-001':11.2, 'APP-002':3.7};
      if (Object.hasOwn(pressure,asset.id)) value=pressure[asset.id]*(1+wave*0.012);
    }
    if (key==='storage') value=base*(1 + 0.025*Math.sin(t/190));
    return Number(value.toFixed(2));
  }
  function contributors(obj,key) {
    return (obj.members || [obj]).filter(a => key==='gpu' ? a.gpu : a.base[dimensions.indexOf(key)]!==null);
  }
  function reading(members,key,t,channel) {
    let total=0;
    for (const a of members) { const v=sample(a,key,t,channel); if(v===null) return null; total+=v; }
    return total;
  }
  const ruleDefs = [
    {id:'node-memory', asset:'SRV-001', metric:'memory', level:'严重', threshold:56, duration:5, max:64},
    {id:'app-cpu', asset:'APP-001', metric:'cpu', level:'警告', threshold:3, duration:5, max:4},
    {id:'billing-memory', asset:'APP-002', metric:'memory', level:'严重', threshold:3, duration:5, max:4}
  ];
  const rulesFor = visible => ruleDefs.filter(r=>visible.some(a=>a.id===r.asset));
  function validRule(rule,threshold,duration) {
    return Number.isFinite(threshold) && threshold>0 && threshold<=rule.max && Number.isInteger(duration) && duration>=1 && duration<=1440;
  }
  function config(rule) {
    const saved=Review.read('monitor-rule-'+rule.id, {threshold:rule.threshold,duration:rule.duration});
    if (!saved || !validRule(rule,saved.threshold,saved.duration)) throw new Error('监控规则数据无效：'+rule.id);
    return saved;
  }
  function events(visible) {
    const rows=[];
    for (const rule of rulesFor(visible)) {
      const asset=visible.find(a=>a.id===rule.asset), {threshold,duration}=config(rule);
      let start=null, event=null;
      for (let t=-ranges['7d']; t<=0; t++) {
        const v=sample(asset,rule.metric,t);
        if (v!==null && v>threshold) {
          if (start===null) start=t;
          if (!event && t-start+1>=duration) {
            event={asset,metric:rule.metric, level:rule.level, state:'open', start, at:t, value:v, note:`高于 ${threshold} ${metrics[rule.metric][1]}，连续 ${duration} 个分钟样本`};
            rows.push(event);
          }
        } else {
          start=null;
          if(event && v!==null) {event.state='recovered';event.until=t;event=null;}
        }
      }
    }
    // A collector outage is counted once, even when several measurements use that source.
    for(const [id,metric,channel,note] of [['SRV-001','gpu',1,'GPU 1 · DCGM 停止上报'],['APP-002','network',0,'容器网络计数器停止上报']]) {
      const asset=visible.find(a=>a.id===id);
      if(!asset || sample(asset,metric,0,channel)!==null) continue;
      let at=0;
      while(at>-ranges['7d'] && sample(asset,metric,at-1,channel)===null) at--;
      rows.push({asset,metric,channel,state:'missing',level:'警告',at,note});
    }
    return rows.sort((a,b)=>(b.until??b.at)-(a.until??a.at));
  }
  function counts(rows) {return {open:rows.filter(e=>e.state==='open').length,missing:rows.filter(e=>e.state==='missing').length};}
  const summary=()=>counts(events(allowedAssets()));
  function contextLinks(a) {
    const node=a.ns==='shared-data'?'shared-pg':a.ns==='billing'?'billing-api':'order-api';
    const tool=a.type==='database'?'database':'k8s';
    const diag='#diagnose/'+[tool,source(a.ns),a.ns,a.id].map(encodeURIComponent).join('/');
    const ledger=a.type==='app' ? `<a href="#systems/${a.ns==='orders'?'SYS-001':'SYS-002'}">业务系统台账</a>` : a.ns==='orders' ? '<a href="#machines/SRV-001">机器台账</a>' : '';
    return `${ledger}<a href="#prod-east/topology/${a.ns}/${node}">查看影响拓扑</a><a href="${diag}">实时诊断</a>`;
  }
  function routeHead(type,ns,range,spaces,filterQuery='') {
    const namespaces=Object.fromEntries(['all',...spaces].map(s=>[link(type,s,range),nsLabels[s]]));
    const windows=Object.fromEntries(Object.keys(ranges).map(r=>[link(type,ns,r)+filterQuery,r.replace('h',' 小时').replace('d',' 天')]));
    return `<nav class="crumbs"><a href="#platform">平台看板</a> › <a href="#prod-east/overview/${ns}">prod-east</a> › 监控</nav>
      <div class="heading"><div><h1>${type==='alerts'?'告警中心':types[type]+'监控'}</h1><p class="note">CLS-001 · 示例快照 2026-11-19 09:40（UTC+8）</p></div>
      <div class="toolbar">${jumpSelect('命名空间',namespaces,link(type,ns,range))}${jumpSelect('时间范围',windows,link(type,ns,range)+filterQuery)}</div></div>
      <nav class="tabs" aria-label="监控对象">${Object.entries(types).map(([key,name])=>`<a href="${link(key,ns,range)}"${key===type?' aria-current="page"':''}>${name}</a>`).join('')}</nav>`;
  }
  function assetLinks(list,range) {
    return list.map(a=>`<li><a class="go" href="${link(a.type,a.ns,range)}">${types[a.type]} · ${a.name}</a><small>${a.id}</small></li>`).join('');
  }
  function details(obj,visible,range) {
    const cluster=!!obj.members;
    const related=cluster ? visible.filter(a=>obj.ns==='all'||a.ns===obj.ns) : visible.filter(a=>{
      if (a.id===obj.id) return false;
      if (obj.type==='database') return a.type==='app';
      if (a.type==='database') return obj.type==='app';
      return a.ns===obj.ns;
    });
    const sources=[...new Set((obj.members||[obj]).map(a=>source(a.ns)))].join('、');
    return `<section class="panel"><div class="group-title"><h2>${obj.name} <small>${obj.id}</small></h2><small>${nsLabels[obj.ns]}</small></div>
      <p>${cluster?`按命名空间汇总 ${obj.members.length} 个工作负载或数据库实例。每个实例按资产编号计一次。`:obj.info}</p>
      <p class="note">采集目标 ${sources}</p><div class="toolbar foot">${cluster?`<a href="#prod-east/topology/${obj.ns}">集群拓扑</a>`:contextLinks(obj)}<a href="${link('alerts',obj.ns,range)}">查看告警</a></div>
      <details class="foot"${cluster?' open':''}><summary>关联对象（${related.length}）</summary><ul class="impact-list">${assetLinks(related,range)}</ul></details></section>`;
  }
  const collector = (key,members) => {
    if(key==='gpu') return 'DCGM · 设备级';
    if(key==='requests') return 'Ingress · 入口请求计数器';
    const layer={machine:'节点', os:'系统', kernel:'内核', process:'进程', app:'容器', database:'数据库实例'};
    const probe={cpu:'CPU 时间',memory:'内存统计',network:'接口字节计数器',storage:'卷容量'};
    return [...new Set(members.map(a=>layer[a.type]))].join('、') + ' · ' + probe[key];
  };
  function timeline(members,key,minutes,channel) {
    const segments=[], gaps=[]; let run=null, gap=null;
    for (let t=-minutes;t<=0;t++) {
      const value=reading(members,key,t,channel);
      if(value===null) {
        if(!gap) {gap=[t,t];gaps.push(gap);} else gap[1]=t;
        run=null;
      } else {
        if(!run) {run=[];segments.push(run);} run.push([t,value]); gap=null;
      }
    }
    return {segments,gaps};
  }
  // Keep each bucket's extrema and endpoints. Never connect across an absent sample.
  function vertices(run,minutes) {
    const stride=Math.ceil(minutes/105), points=[];
    for(let i=0;i<run.length;i+=stride) {
      const endIndex=Math.min(i+stride,run.length)-1;
      let low=i,high=i;
      for(let j=i+1;j<=endIndex;j++) {if(run[j][1]<run[low][1]) low=j; if(run[j][1]>run[high][1]) high=j;}
      for(const index of [...new Set([i,low,high,endIndex])].sort((a,b)=>a-b)) points.push(run[index]);
    }
    return points;
  }
  function plot(key,series,minutes,marker) {
    let peak=0;
    for(const s of series) for(const run of s.segments) for(const p of run) peak=Math.max(peak,p[1]);
    const max=key==='gpu'?100:Math.max(1,Math.ceil(peak*1.06));
    const x=t=>38+(t+minutes)/minutes*306, y=v=>74-v/max*60;
    const paths=series.map((s,i)=>s.segments.map(run=>{
      const color=i?'var(--warning)':'var(--primary)';
      if(run.length===1) return `<circle cx="${x(run[0][0])}" cy="${y(run[0][1])}" r="2" fill="${color}"/>`;
      const d=vertices(run,minutes).map(([t,v],j)=>(j?'L':'M')+x(t).toFixed(2)+','+y(v).toFixed(2)).join(' ');
      return `<path d="${d}" fill="none" stroke="${color}" stroke-width="1.8"${i?' stroke-dasharray="5 2"':''}/>`;
    }).join('')).join('');
    const mark=marker==null?'':`<line x1="${x(marker)}" x2="${x(marker)}" y1="8" y2="75" stroke="var(--fg)" stroke-dasharray="2 3"/>`;
    return `<svg viewBox="0 0 355 98" width="100%" role="img" aria-label="${metrics[key][0]}历史曲线，${clock(-minutes,true)} 至 ${clock(0,true)}，纵轴 0 至 ${max} ${metrics[key][1]}">
      <path d="M38 14H344 M38 74H344" stroke="var(--line)"/>${paths}${mark}
      <g font-size="10" fill="var(--sub)"><text x="32" y="17" text-anchor="end">${max}</text><text x="32" y="76" text-anchor="end">0</text><text x="38" y="91">${clock(-minutes,minutes>=1440)}</text><text x="344" y="91" text-anchor="end">${clock(0,minutes>=1440)}</text></g></svg>`;
  }
  function chart(obj,key,minutes,focus) {
    const [label,unit]=metrics[key], members=contributors(obj,key);
    const title=`<h3>${label} <small>${unit}</small></h3>`;
    if(!members.length) {
      const reason={gpu:'未分配可归属的 GPU 设备',requests:'业务请求按入口计数；此对象没有独立入口',network:'此对象没有独立网络接口计数器',storage:'此对象没有独立卷容量'}[key];
      return `<article class="panel" data-metric="${key}">${title}<p class="foot">不适用</p><p class="note">${reason}</p></article>`;
    }
    const channels=key==='network'?['接收','发送']:key==='gpu'?['GPU 0','GPU 1']:[''];
    const series=channels.map((_,i)=>timeline(members,key,minutes,i));
    const current=series.map((s,i)=>{
      const last=s.segments.at(-1)?.at(-1);
      const label=channels[i]?`${channels[i]}${i?'（虚线）':'（实线）'} `:'';
      if(!last || last[0]<0) return `${label}<b class="warn">缺数据</b>${last?` · 最近 ${clock(last[0])} 为 ${num(last[1])} ${unit}`:' · 窗口内无样本'}`;
      return `${label}<b class="num">${num(last[1])}</b> ${unit}`;
    });
    const gaps=series.flatMap((s,i)=>s.gaps.map(([a,b])=>`${channels[i]} ${clock(a,minutes>=1440)}–${clock(b,minutes>=1440)}${b===0?'（持续）':''}`));
    const marker=focus?.metric===key?focus.at:null;
    const capacity=members.reduce((v,a)=>v+(a.disk||0),0);
    let extra='';
    if(key==='storage') extra=` · 总量 ${capacity} GiB，可用 ${num(capacity-reading(members,key,0,0))} GiB`;
    if(key==='gpu') extra=' · 显存 GPU 0 已用 6 / 16 GiB，GPU 1 缺数据';
    return `<article class="panel" data-metric="${key}">${title}<p class="foot">${current.join(' · ')}</p>${plot(key,series,minutes,marker)}
      ${marker==null?'':`<p class="warn">告警定位 · ${clock(marker,true)} · ${focus.channel===1?'GPU 1 · ':''}${reading(members,key,marker,focus.channel??0)===null?'缺数据':num(reading(members,key,marker,focus.channel??0))+' '+unit}</p>`}
      <p class="note">${collector(key,members)} · ${members.length} 个对象 · 采样窗口截至 ${clock(0)}${extra}</p>
      ${gaps.length?`<p class="note warn">采样断点 · ${gaps.join('；')}</p>`:''}</article>`;
  }
  function thresholdRules(visible,ns) {
    const rules=rulesFor(visible.filter(a=>ns==='all'||a.ns===ns));
    const forms=rules.map(rule=>{
      const {threshold,duration}=config(rule), [metric,unit]=metrics[rule.metric];
      return `<form data-rule="${rule.id}" class="foot" onsubmit="event.preventDefault();Monitor.saveRule(this)" novalidate><fieldset><legend>${rule.asset} · ${metric}</legend>
        <div class="toolbar"><label>高于（${unit}） <input type="number" name="threshold" step="any" max="${rule.max}" required value="${threshold}" style="width:7em"></label>
        <label>持续（分钟） <input type="number" name="duration" min="1" max="1440" step="1" required value="${duration}" style="width:7em"></label>
        <button type="submit">保存规则</button></div><p role="status" class="note foot">上限 ${rule.max} ${unit} · 持续时间 1–1440 分钟</p></fieldset></form>`;
    });
    if(!rules.length) return '<p class="note">此命名空间暂无阈值规则。</p>';
    if(!Review.admin()) return '<p class="note">当前身份可查看规则，编辑需要平台管理员权限。</p><ul>'+rules.map(r=>{const c=config(r);return `<li>${r.asset} · ${metrics[r.metric][0]} 高于 ${c.threshold} ${metrics[r.metric][1]}，持续 ${c.duration} 分钟</li>`;}).join('')+'</ul>';
    return `<p class="note">每分钟判定一次。保存后使用新规则回放此快照内的样本，并更新告警和首页计数。</p>${forms.join('')}`;
  }
  function saveRule(form) {
    const msg=form.querySelector('[role="status"]');
    if(!Review.admin()) {msg.textContent='需要平台管理员权限。';return;}
    const [area,type,scope]=location.hash.slice(1).split('/');
    const ns=scope && !Object.hasOwn(ranges,scope.split('?')[0])?scope:'all';
    const rule=rulesFor(allowedAssets().filter(a=>ns==='all'||a.ns===ns)).find(r=>r.id===form.dataset.rule);
    if(area!=='monitor'||type!=='alerts'||!rule) {msg.textContent='无法在当前范围保存此规则。';return;}
    const threshold=form.elements.threshold.valueAsNumber, duration=form.elements.duration.valueAsNumber;
    if(!validRule(rule,threshold,duration)) {
      msg.textContent=`阈值必须大于 0 且不超过 ${rule.max} ${metrics[rule.metric][1]}，持续时间必须为 1–1440 的整数分钟。`;
      msg.className='warn foot';return;
    }
    Review.save('monitor-rule-'+rule.id,{threshold,duration});
    Review.audit('保存监控阈值规则',`${rule.asset} · ${metrics[rule.metric][0]} > ${threshold} ${metrics[rule.metric][1]} · ${duration} 分钟`);
    Review.refresh();
    const updated=document.querySelector(`form[data-rule="${rule.id}"]`);
    if(updated) {
      updated.closest('details').open=true;
      updated.querySelector('[role="status"]').textContent='已保存。告警及首页计数已重新计算。';
      updated.querySelector('button').focus();
    }
  }
  function alertPage(ns,range,params,visible,spaces) {
    const all=events(visible), totals=counts(all), minutes=ranges[range];
    const scoped=visible.filter(a=>ns==='all'||a.ns===ns);
    const fields={state:{all:'全部状态',...statuses},level:{all:'全部严重度','严重':'严重','警告':'警告'},asset:{all:'全部资产',...Object.fromEntries(scoped.map(a=>[a.id,a.id+' · '+a.name]))}};
    const selected={};
    for(const [field,choices] of Object.entries(fields)) {
      selected[field]=params.get(field)??'all';
      if(!Object.hasOwn(choices,selected[field])) return unavailable();
    }
    const rows=all.filter(e=>(ns==='all'||e.asset.ns===ns) && (e.until==null||e.until>=-minutes) && (selected.state==='all'||e.state===selected.state) && (selected.level==='all'||e.level===selected.level) && (selected.asset==='all'||e.asset.id===selected.asset));
    const filters=Object.entries(fields).map(([field,choices])=>{
      const urls={};
      for(const [value,label] of Object.entries(choices)) {
        const q=new URLSearchParams({...selected,[field]:value});
        urls[link('alerts',ns,range)+'?'+q]=label;
      }
      return jumpSelect({state:'事件状态',level:'严重度',asset:'资产'}[field],urls,link('alerts',ns,range)+'?'+new URLSearchParams(selected));
    }).join('');
    const body=rows.map(e=>{
      const {asset,metric,at}=e;
      const targetRange=Object.keys(ranges).find(r=>ranges[r]>=Math.max(minutes,-at));
      const dest=link(asset.type,asset.ns,targetRange);
      const curve=dest+`?metric=${metric}&amp;at=${at}&amp;channel=${e.channel??0}`;
      return `<tr><td><b class="${e.state==='recovered'?'ok':'warn'}">${statuses[e.state]}</b><small>${e.level}</small></td>
        <td><a href="${dest}">${asset.id} · ${asset.name}</a><small>${asset.ns} · ${source(asset.ns)}</small></td>
        <td>${metrics[metric][0]}<small>${e.note}</small></td><td><time>${clock(at,true)}</time><small>${e.until==null?'持续中':'恢复 '+clock(e.until,true)}</small></td>
        <td><div class="toolbar"><a href="${curve}">定位曲线</a>${contextLinks(asset)}</div></td></tr>`;
    }).join('');
    const activeFilters=new URLSearchParams(Object.entries(selected).filter(([,value])=>value!=='all'));
    const head=routeHead('alerts',ns,range,spaces,activeFilters.size?'?'+activeFilters:'');
    return head+`<section class="panel"><div class="group-title"><h2>告警事件</h2><small>平台首页 · 当前身份全部授权资产</small></div>
      <p><strong>未恢复异常 ${totals.open}</strong> · <strong>采集中断 ${totals.missing}</strong></p>
      <p class="note">首页分别统计快照时仍超阈值的事件和仍中断的采集源。已恢复事件仅在历史列表显示。下方筛选仅影响明细。</p>
      <div class="toolbar foot">${filters}</div><p class="note foot" role="status">当前筛选 ${rows.length} 条 · ${clock(-minutes,true)} 至 ${clock(0,true)} 内触发或持续的事件</p>
      ${body?`<div class="table-scroll" role="region" aria-label="告警事件明细" tabindex="0"><table style="min-width:600px"><thead><tr><th>状态</th><th>受影响资产</th><th>触发条件</th><th>触发时间</th><th>排查</th></tr></thead><tbody>${body}</tbody></table></div>`:'<p class="foot">当前条件没有匹配的告警。可调整筛选或扩大时间范围。</p>'}</section>
      <details class="panel"><summary>阈值与持续时间规则</summary>${thresholdRules(visible,ns)}</details>`;
  }
  const unavailable=()=>'<section class="panel" role="alert"><h1>监控范围不可访问</h1><p class="foot">链接无效或超出当前身份的授权范围。</p><a class="go" href="#monitor/cluster">返回可见监控</a></section>';
  function render(parts) {
    const [,type,scopeParam,timeParam]=parts;
    if(parts[0]!=='monitor'||!Object.hasOwn(types,type)||parts.length>4) return unavailable();
    // A time-only deep link uses #monitor/<type>/<time>.
    const timeOnly=scopeParam && Object.hasOwn(ranges,scopeParam.split('?')[0]);
    if(timeOnly && timeParam!==undefined) return unavailable();
    const ns=timeOnly?'all':scopeParam||'all';
    const spec=(timeOnly?scopeParam:timeParam)??'1h';
    const [range,query='']=spec.split('?'), params=new URLSearchParams(query);
    const spaces=visibleSpaces();
    if(!Object.hasOwn(ranges,range) || (ns!=='all'&&!spaces.includes(ns))) return unavailable();
    const visible=allowedAssets();
    if(type==='alerts') return alertPage(ns,range,params,visible,spaces);
    const head=routeHead(type,ns,range,spaces);
    const scoped=visible.filter(a=>ns==='all'||a.ns===ns);
    const candidates=scoped.filter(a=>a.type===type);
    const obj=type==='cluster'?{type,ns,name:'prod-east',id:'CLS-001',members:scoped.filter(a=>['app','database'].includes(a.type))}:candidates[0];
    if(!obj) return head+`<section class="panel"><h2>当前命名空间没有${types[type]}监控对象</h2><p class="foot"><a href="${link(type,'all',range)}">查看全部可见命名空间</a></p></section>`;
    let focus=null;
    if(params.size) {
      const metric=params.get('metric'), rawAt=params.get('at'), at=Number(rawAt), channel=Number(params.get('channel')??0);
      if(!Object.hasOwn(metrics,metric) || !rawAt || !/^-?\d+$/.test(rawAt) || at>0 || at < -ranges[range] || ![0,1].includes(channel) || (channel===1&&!['network','gpu'].includes(metric)) || !contributors(obj,metric).length) return unavailable();
      focus={metric,at,channel};
    }
    const keys=Object.keys(metrics);
    if(focus) keys.unshift(...keys.splice(keys.indexOf(focus.metric),1));
    const choices=candidates.length>1?`<nav class="bar" aria-label="可见实例"><span>选择实例</span>${candidates.map(a=>`<a href="${link(type,a.ns,range)}"${a===obj?' aria-current="true"':''}>${a.name}</a>`).join('')}</nav>`:'';
    const markers=focus?`<p class="warn">已定位 ${metrics[focus.metric][0]} · ${clock(focus.at,true)}（图中竖线）</p>`:'';
    return head+choices+details(obj,visible,range)+`<section aria-label="历史指标"><div class="group-title"><div><h2>指标历史</h2>${markers}</div><small>${clock(-ranges[range],true)} 至 ${clock(0,true)} · 每分钟采样</small></div><div class="pair">${keys.map(k=>chart(obj,k,ranges[range],focus)).join('')}</div></section>`;
  }
  return {render,summary,saveRule};
})();

</script>

<script>
'use strict';
window.Inspection = (() => {
  const { esc, read, save, admin, audit, download, refresh } = Review;
  const key = 'inspection-weekly-v1';
  const week = '2026-11-16', previousWeek = '2026-11-09', nextWeek = '2026-11-23';
  const reviewTime = Date.parse('2026-11-19T04:00:00Z');
  const minute = 60000, day = 1440 * minute;
  const zones = { 'Asia/Shanghai': 8, UTC: 0, 'Asia/Tokyo': 9 };
  const weekdays = ['周一', '周二', '周三', '周四', '周五', '周六', '周日'];
  const sourceA = 'prod-east/agent-a', sourceB = 'prod-east/agent-b';
  const accounts = { 'svc-inspection': [sourceA, sourceB], 'svc-orders': [sourceA] };
  const assets = [
    { id: 'SRV-001', name: '订单工作节点', source: sourceA, ns: 'orders', checks: ['M1','M2','M3','M4','M5','V2'], link: '#machines/SRV-001' },
    { id: 'SYS-001', name: '订单系统', source: sourceA, ns: 'orders', checks: ['A3'], link: '#systems/SYS-001' },
    { id: 'order-api', name: '订单服务', source: sourceA, ns: 'orders', checks: ['V1','V3','A1','A4','A5'], link: '#prod-east/topology/orders/order-api' },
    { id: 'shared-pg', name: '共享数据库', source: sourceA, ns: 'shared-data', checks: ['A2'], link: '#prod-east/topology/shared-data/shared-pg' },
    { id: 'billing-api', name: '计费服务', source: sourceB, ns: 'billing', checks: ['A1','A5'], link: '#prod-east/topology/billing/billing-api' }
  ];
  const groups = { M: '机器', V: '漏洞与补丁', A: '应用' };
  const checks = {
    M1: ['运行与重启', '运行记录', '近 24 小时心跳连续，重启 0 次。'],
    M2: ['CPU 与内存', '5 分钟资源样本', 'CPU 峰值 42%，内存峰值 61%，均低于 85% 评审线。'],
    M3: ['可疑进程', '进程台账摘要', '最近一次盘点的 18 个进程均有已核验的归属。'],
    M4: ['配置合规', '配置基线回执', '主机基线 6 项符合 6 项。'],
    M5: ['异常登录与权限变更', '脱敏审计摘要', '近 24 小时异常登录 0 次，权限变更 1 笔，有审批记录。'],
    V1: ['组件已知漏洞', '部署版本与示例公告', '订单组件 2.8.1，低于公告修复版本 2.10.0。'],
    V2: ['待更新补丁', '维护清单', '与本期维护清单比对，待应用补丁 0 项。'],
    V3: ['修复验证', '部署后版本回执', '缺少整改后的部署版本，等待登记和复检。'],
    A1: ['服务可用性', '服务采样', '5 分钟内模拟心跳 5/5 正常，最近响应 38 ms。'],
    A2: ['数据库状态', '数据库只读状态回执', '连接 34/100，副本延迟 0.4 秒，阈值 2 秒。'],
    A3: ['流量异常', '业务流量汇总', '5 分钟均值 98 req/s，参考区间 70–120 req/s。'],
    A4: ['Web 安全配置', '部署配置核验单', '发布台账内的 3 项 Web 配置均符合基线。'],
    A5: ['指定 API', '业务接口验收回执', '服务状态接口预期 HTTP 200，样本 HTTP 200，耗时 41 ms。']
  };
  const issue = 'ISSUE-DEMO-017', baseline = '2.8.1', fixed = '2.10.0';
  const asset = id => assets.find(a => a.id === id);
  const allowed = (a, scope = '') => !!a && (admin() || (a.source === sourceA && ['orders','shared-data'].includes(a.ns))) &&
    (!scope || [a.id, a.ns, a.source.split('/')[0], a.source].includes(scope));
  const visible = (rows, scope) => rows.filter(row => allowed(asset(row.asset), scope));
  const unique = values => [...new Set(values)];
  const datetime = (at, zone) => new Intl.DateTimeFormat('sv-SE', { timeZone: zone, year:'numeric', month:'2-digit', day:'2-digit', hour:'2-digit', minute:'2-digit' }).format(at);
  const schedule = p => `每${weekdays[p.weekday]} ${p.time} · ${p.zone}`;
  function dueAt(p, start) {
    const [hour, min] = p.time.split(':').map(Number);
    return Date.parse(start+'T00:00:00Z') + p.weekday * day + (hour - zones[p.zone]) * 60 * minute + min * minute;
  }
  function checklist(p) {
    return p.assets.flatMap(id => asset(id).checks.filter(c => p.checks.includes(c)).map(check => ({asset:id, check, status:'待执行', evidence:'', at:null})));
  }
  function obstacle(db, executor, a) {
    if (!accounts[executor].includes(a.source) || db.revoked.includes(executor+'@'+a.source)) return '执行身份无目标授权';
    if (db.offline.includes(a.source)) return 'Agent 离线';
    return '';
  }
  const runFor = (db, p, start) => db.runs.find(r => r.plan.id === p.id && r.week === start);
  function makeRun(p, start, at) {
    return {id:`RUN-${p.id.slice(3)}-${start.replaceAll('-','')}`, week:start, plan:structuredClone(p), frozen:at, due:dueAt(p,start), rows:checklist(p), attempts:[], repairs:[]};
  }
  function collect(db, r, mode, at, scope) {
    const events = [];
    const pending = r.rows.filter(row => ['待执行','漏检'].includes(row.status) && (!scope || allowed(asset(row.asset),scope)));
    for (const id of unique(pending.map(row => row.asset))) {
      const reason = mode === '漏跑' ? '到期后 24 小时未收到调度事件' : obstacle(db,r.plan.executor,asset(id));
      for (const row of pending.filter(row => row.asset === id)) {
        row.status = reason ? '漏检' : ({V1:'发现', V3:'证据不足'}[row.check] || '通过');
        row.evidence = reason || checks[row.check][2];
        row.at = at;
      }
      events.push({asset:id, result:reason || '已采样'});
    }
    if (events.length) r.attempts.push({mode, at, events});
  }
  function seed() {
    const p = {id:'PL-001', name:'业务资产周检', owner:'业务运维组', executor:'svc-inspection', weekday:1, time:'09:00', zone:'Asia/Shanghai', assets:assets.map(a=>a.id), checks:Object.keys(checks)};
    const db = {plans:[p], runs:[], offline:[], revoked:['svc-inspection@'+sourceB]};
    for (const start of [week,previousWeek]) {
      const at = dueAt(p,start) + (start === previousWeek ? day : 0);
      const r = makeRun(p,start,at);
      collect(db,r,start === week ? '自动到期' : '漏跑',at);
      db.runs.push(r);
    }
    return db;
  }
  const load = () => read(key,null) ?? seed();
  function counts(rows) {
    const byAsset = new Map();
    for (const row of rows) {
      if (!byAsset.has(row.asset)) byAsset.set(row.asset,new Map());
      const items = byAsset.get(row.asset);
      const rank = row.status === '待执行' ? 0 : row.status === '漏检' ? 1 : 2;
      items.set(row.check,Math.max(items.get(row.check) ?? 0,rank));
    }
    let completed=0, missed=0;
    for (const items of byAsset.values()) {
      const ranks = [...items.values()];
      if (ranks.every(rank => rank === 2)) completed++;
      else if (ranks.includes(1)) missed++;
    }
    return {planned:byAsset.size, completed, missed};
  }
  function weekly(db, scope) {
    return counts(db.plans.flatMap(p => visible(runFor(db,p,week)?.rows ?? checklist(p),scope)));
  }
  const summary = (scope = '') => weekly(load(),scope);
  const url = (area, ...parts) => '#inspection/'+[area,...parts.filter(Boolean)].map(encodeURIComponent).join('/');
  const link = (href, text, cls='') => `<a href="${esc(href)}" class="${cls}">${esc(text)}</a>`;
  const go = (area,id,scope,text) => link(url(area,id,scope),text);
  const sections = {plans:'巡检计划',runs:'执行记录',reports:'巡检报告'};
  const note = text => `<p class="note foot">${esc(text)}</p>`;
  const panel = (title,body,action='') => `<section class="panel"><div class="group-title"><h2>${esc(title)}</h2>${action}</div>${body}</section>`;
  const facts = pairs => `<dl class="facts">${pairs.map(([k,v])=>`<dt>${esc(k)}</dt><dd>${esc(v)}</dd>`).join('')}</dl>`;
  const table = (cols,rows) => `<div class="table-scroll"><table><thead><tr>${cols.map(c=>`<th scope="col">${esc(c)}</th>`).join('')}</tr></thead><tbody>${rows.map(cells=>`<tr>${cells.map(v=>`<td>${v}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`;
  const options = (items,value) => items.map(([id,n])=>`<option value="${esc(id)}" ${String(id)===String(value)?'selected':''}>${esc(n)}</option>`).join('');
  const op = (name,label,primary=false) => `<button type="submit" name="op" value="${name}"${primary?' class="action"':''}>${esc(label)}</button>`;
  const form = (action,id,scope,body) => `<form data-inspection="${action}" data-id="${esc(id)}" data-scope="${esc(scope)}">${body}<p class="warn" role="alert" data-error></p></form>`;
  const scopeText = scope => scope || (admin()?'全部授权资产':'我的可见范围');
  function head(area,title,scope='') {
    return `<nav class="crumbs" aria-label="当前位置">${link('#platform','资产')} › ${go(area,'',scope,sections[area])}</nav><div class="heading"><div><h1 tabindex="-1">${esc(title)}</h1><p class="note">模拟事件与证据 · 评审周 2026-11-16 至 11-22 · ${esc(scopeText(scope))}</p></div></div>
      <nav class="tabs" aria-label="巡检视图">${Object.entries(sections).map(([id,n])=>`<a href="${esc(url(id,scope))}" ${id===area?'aria-current="page"':''}>${n}</a>`).join('')}</nav>`;
  }
  function inaccessible(area) {
    return head(area,sections[area])+`<section class="panel" role="alert">此入口不存在或超出当前权限。 ${go(area,'','','返回列表')}</section>`;
  }
  function statLine(c) {
    return `应检 ${c.planned} · 实检 ${c.completed} · 漏检 ${c.missed} · 待执行 ${c.planned-c.completed-c.missed}`;
  }
  const statHelp = '按资产主 ID 去重。全部适用项已执行计实检，证据不足另列；存在未补齐的漏项计漏检。跨计划同资产同项已有采样可抵同周应检。';
  function scopePicker(area,scope) {
    const values = unique(assets.filter(a=>allowed(a)).flatMap(a=>[a.source.split('/')[0],a.ns,a.id]));
    return `<label class="scope">筛选范围 <select data-inspect-filter="${area}">${options([['','全部可见资产'],...unique([...values,...(scope?[scope]:[])]).map(v=>[v,v])],scope)}</select></label>`;
  }
  function listing(db,area,scope) {
    const body = head(area,sections[area],scope)+`<div class="toolbar">${scopePicker(area,scope)}${area==='plans'&&admin()?link(url('plans','new',scope),'新建每周计划','action'):''}</div>`;
    const total = panel('本周巡检资产',`<strong class="num">${statLine(weekly(db,scope))}</strong>${note(statHelp)}`);
    if (area==='plans') {
      const rows = db.plans.flatMap(p => {
        const items=visible(checklist(p),scope); if(!items.length) return [];
        return [[go(area,p.id,scope,p.name)+`<small>${esc(p.id)}</small>`,esc(schedule(p)),esc(p.owner),String(counts(items).planned)]];
      });
      return body+total+panel('每周计划',rows.length?table(['计划','执行时间','负责人','可见资产'],rows):note('当前范围内暂无计划。'));
    }
    const rows = db.runs.slice().sort((a,b)=>b.week.localeCompare(a.week)||b.frozen-a.frozen).flatMap(r=>{
      const items=visible(r.rows,scope); if(!items.length) return [];
      return [[go(area,r.id,scope,area==='runs'?r.id:r.plan.name)+`<small>${esc(area==='runs'?r.plan.name:r.id)}</small>`,esc(r.week),esc(statLine(counts(items))),esc(r.plan.owner)]];
    });
    return body+total+panel(sections[area],rows.length?table([area==='runs'?'运行编号':'周期报告','周期起始','资产结果','负责人'],rows):note('当前范围内暂无运行。计划首次触发后会生成记录和报告。'));
  }
  function preview(db,p,scope) {
    const rows = visible(checklist(p),scope);
    const ids = unique(rows.map(row=>row.asset));
    return table(['应检对象','范围','所需数据','执行前提'],ids.map(id=>{
      const a=asset(id), blocked=obstacle(db,p.executor,a);
      return [link(a.link,id)+`<small>${esc(a.name)}</small>`,esc(a.source)+`<small>${esc(a.ns)}</small>`,rows.filter(row=>row.asset===id).map(row=>esc(checks[row.check][1])).join('、'),blocked?`<span class="warn">${esc(blocked)}</span>`:'可执行'];
    }))+note(`${ids.length} 个应检资产 · ${rows.length} 项适用检查。首次触发冻结范围、检查项、负责人、执行身份及时间。`);
  }
  function planForm(db,p,scope='') {
    const draft = p || {name:'',owner:'',executor:'svc-inspection',weekday:0,time:'09:00',zone:'Asia/Shanghai', assets:assets.filter(a=>allowed(a,scope)).map(a=>a.id), checks:Object.keys(checks)};
    const box = (name,id,label,checked)=>`<label><input type="checkbox" name="${name}" value="${esc(id)}" ${checked?'checked':''}> ${esc(label)}</label>`;
    const input = (name,title,value,max)=>`<label>${title}<br><input name="${name}" value="${esc(value)}" required maxlength="${max}"></label>`;
    const select = (name,label,items,value)=>`<label>${label}<br><select name="${name}">${options(items,value)}</select></label>`;
    return head('plans',p?'编辑每周计划':'新建每周计划',scope)+panel('计划配置',form('plan',p?.id||'',scope,`
      <div class="toolbar">${input('name','计划名称',draft.name,64)}${input('owner','负责人',draft.owner,40)}${select('executor','Gateway 执行身份',Object.keys(accounts).map(v=>[v,v]),draft.executor)}</div>
      <div class="toolbar foot">${select('weekday','每周',weekdays.map((v,i)=>[i,v]),draft.weekday)}<label>执行时间<br><input type="time" name="time" value="${esc(draft.time)}" required></label>${select('zone','时区',Object.keys(zones).map(v=>[v,v]),draft.zone)}</div>
      <fieldset class="foot"><legend>资产范围</legend><div class="toolbar">${assets.map(a=>box('asset',a.id,`${a.id} · ${a.ns}`,draft.assets.includes(a.id))).join('')}</div></fieldset>
      <fieldset class="foot"><legend>适用检查项</legend>${Object.entries(groups).map(([g,n])=>`<p><b>${n}</b></p><div class="toolbar">${Object.keys(checks).filter(c=>c.startsWith(g)).map(c=>box('check',c,checks[c][0],draft.checks.includes(c))).join('')}</div>`).join('')}</fieldset>
      ${p?note('已冻结周期继续使用原配置。修改用于尚未冻结的周期。'):''}<div data-preview aria-live="polite"></div><div class="toolbar foot">${op('preview','预览计划',true)}<button name="op" value="save" disabled>保存计划</button>${go('plans',p?.id,scope,'取消')}</div>`));
  }
  function envForm(db,p,rows) {
    const targets=unique(rows.map(row=>asset(row.asset).source));
    const state = targets.map(target=>`${target} · ${db.offline.includes(target)?'离线':'在线'} · ${obstacle({...db,offline:[]},p.executor,{source:target})?'无授权':'已授权'}`).join(' / ');
    return `<details class="foot"><summary>演练离线、撤权与恢复</summary>${note(`${p.executor} ｜ ${state}`)}${form('env',p.id,'',`<input type="hidden" name="executor" value="${esc(p.executor)}"><div class="toolbar foot"><label>来源目标 <select name="target">${options(targets.map(v=>[v,v]))}</select></label><label>模拟事件 <select name="event">${options([['offline','Agent 离线'],['online','Agent 恢复在线'],['revoke','撤销执行身份授权'],['grant','恢复原有授权']])}</select></label>${op('apply','应用模拟事件')}</div>`)}</details>`;
  }
  function planDetail(db,p,scope) {
    const cycle = runFor(db,p,week);
    const action = admin()?link(url('plans',p.id,'edit'),'编辑计划'):'';
    const controls = !admin()?note('每周计划由平台管理员维护。'):form('trigger',p.id,scope,`<label>演练周期 <select name="week">${options([[week,'本周 · '+week],[nextWeek,'下周 · '+nextWeek]],week)}</select></label><div class="toolbar foot">${op('auto','模拟到期自动触发',true)}${op('manual','手动执行')}${op('miss','模拟漏跑')}</div>${note('自动事件推进到计划时间，漏跑事件推进到到期后 24 小时。同计划同周重复触发打开原运行。')}`);
    return head('plans',p.name,scope)+panel('计划详情',facts([['计划编号',p.id],['每周执行',schedule(p)],['本周到期',datetime(dueAt(p,week),p.zone)+' · '+p.zone],['负责人',p.owner],['执行身份',p.executor]])+controls+(cycle&&visible(cycle.rows,scope).length?`<p class="foot">${go('runs',cycle.id,scope,'查看本周冻结清单与运行')}</p>`:'')+(admin()?envForm(db,p,visible(checklist(p))):''),action)+panel('计划范围预览',preview(db,p,scope));
  }
  function reportModel(r,scope) {
    const rows=visible(r.rows,scope);
    const repairs=r.repairs.filter(entry=>allowed(asset(entry.asset),scope));
    const items=rows.map(row=>{
      const a=asset(row.asset);
      const change=repairs.find(entry=>entry.asset===a.id);
      const last=change?.history.at(-1);
      const verification=['V1','V3'].includes(row.check) && last;
      return {asset:a.id, source:a.source, namespace:a.ns, check:row.check, group:groups[row.check[0]], name:checks[row.check][0],
        status:verification?({'已修复':'通过','仍受影响':'发现','无法验证':'证据不足'}[last.result]):row.status,
        evidence:verification?`${issue} · ${last.result} · ${last.evidence}`:row.evidence, sampledAt:verification?last.at:row.at,
        original:{status:row.status, evidence:row.evidence, at:row.at}};
    });
    return {type:'模拟巡检报告', run:r.id, plan:r.plan.id, planName:r.plan.name, week:r.week, schedule:schedule(r.plan), due:r.due, frozen:r.frozen,
      owner:r.plan.owner, executor:r.plan.executor, zone:r.plan.zone, scope:scopeText(scope), assets:counts(rows),
      initialFindings:rows.filter(i=>i.status==='发现').length, findings:items.filter(i=>i.status==='发现').length, insufficient:items.filter(i=>i.status==='证据不足').length, items, repairs,
      attempts:r.attempts.map(a=>({...a, events:visible(a.events,scope)})).filter(a=>a.events.length)};
  }
  function runDetail(db,r,scope) {
    const m=reportModel(r,scope), p=r.plan;
    const meta=facts([['冻结时刻',datetime(r.frozen,p.zone)],['计划到期',datetime(r.due,p.zone)],['时区',p.zone],['冻结负责人 / 执行身份',p.owner+' / '+p.executor],['本期资产',statLine(m.assets)]]);
    const manifest=unique(m.items.map(i=>i.asset)).map(id=>{
      const items=m.items.filter(i=>i.asset===id), a=asset(id);
      return [link(a.link,id)+`<small>${esc(a.ns)}</small>`,esc(a.source),items.map(i=>i.check).join(' · '),esc(items[0].original.status==='漏检'?items[0].original.evidence:'已采样')];
    });
    const history=m.attempts.map(a=>[esc(datetime(a.at,p.zone)),esc(a.mode),a.events.map(ev=>`${esc(ev.asset)} · ${esc(ev.result)}`).join('<br>')]);
    const recover=admin()&&m.items.some(i=>i.status==='漏检')?form('makeup',r.id,scope,`<div class="toolbar foot">${op('retry','补检本次漏项',true)}</div>${note('补检逐项复核冻结身份及当前目标授权，保留原周期、首次尝试和实际补检时间。')}`):'';
    return head('runs',r.id,scope)+panel('周期运行',meta+`<div class="toolbar">${go('reports',r.id,scope,'查看本期报告')}${link('#diagnose/audit','回看运行审计')}${go('plans',p.id,'','查看当前计划')}</div>`,esc(r.week+' 起始周'))+
      panel('冻结应检清单',table(['资产','来源','应检项编号','采集结果'],manifest)+recover+(admin()?envForm(db,p,visible(r.rows,scope)):''))+
      panel('执行尝试',table(['模拟时间 · '+p.zone,'触发方式','逐资产回执'],history));
  }
  function repairPanel(m,scope) {
    const finding=m.items.find(i=>i.check==='V1'&&i.original.status==='发现'); if(!finding) return '';
    const change=m.repairs.find(c=>c.asset===finding.asset);
    const before=facts([['虚构 Issue',issue],['对象',finding.asset],['首次证据',`${datetime(finding.original.at,m.zone)} · 部署 ${baseline} · 修复线 ${fixed}`],['当前整改状态',change?.history.at(-1)?.result || (change?'已登记，待复检':'待登记')]]);
    const target=`<input type="hidden" name="asset" value="${esc(finding.asset)}">`;
    let body=before;
    if(!change) body+=form('repair',m.run,scope,`${target}<label>修复登记说明 <input name="memo" required maxlength="180" placeholder="记录变更单或部署说明"></label> ${op('register','登记修复')}${note('登记说明单独留存，复检以采集到的版本为准。')}`);
    else {
      body+=facts([['修复登记',`${datetime(change.at,m.zone)} · ${change.actor} · ${change.memo}`]]);
      if(change.history.length) body+=table(['复检时间','首次版本 → 复检版本','结论与证据'],change.history.map(h=>[esc(datetime(h.at,m.zone)),esc(`${baseline} → ${h.version||'未取得'}`),`<b>${esc(h.result)}</b><small>${esc(h.evidence)}</small>`]));
      body+=form('recheck',m.run,scope,`${target}<div class="toolbar foot"><label>模拟已部署版本 <input name="version" maxlength="17" placeholder="如 2.10.0" aria-describedby="ins-version-help"></label>${op('sample','比较版本复检',true)}</div><p id="ins-version-help" class="note foot">输入三段数字版本。留空演练取样缺失；离线与撤权也会留下无法验证的回执。</p>`);
    }
    return panel('整改与版本复检',body);
  }
  function reportDetail(r,scope) {
    const m=reportModel(r,scope);
    const stamp=t=>datetime(t,m.zone);
    const sections=Object.entries(groups).map(([g,n])=>{
      const rows=m.items.filter(i=>i.check.startsWith(g)); if(!rows.length)return '';
      return panel(n,table(['检查项 / 对象','结论','模拟证据 / 时间'],rows.map(i=>[`${esc(i.check+' · '+i.name)}<small>${link(asset(i.asset).link,i.asset)}</small>`,`<b class="${i.status==='通过'?'ok':'warn'}">${esc(i.status)}</b>`,`${esc(i.evidence)}<small>${esc(i.source+' · '+i.namespace+' · '+stamp(i.sampledAt))}</small>`])));
    }).join('');
    const overview=facts([['运行编号',m.run],['周期与负责人',m.week+' 起始周 · '+m.owner],['执行身份',m.executor],['资产口径',statLine(m.assets)],['逐项结果',`共 ${m.items.length} 项 · 首检发现 ${m.initialFindings} 项 · 当前发现 ${m.findings} 项 · 证据不足 ${m.insufficient} 项`]]);
    return head('reports',m.planName+' · 周期报告',scope)+panel('报告摘要',overview+`<div class="toolbar">${form('download',m.run,scope,op('export','下载报告 JSON',true))}${go('runs',m.run,scope,'查看运行与补检')}${link('#diagnose/audit','回看运行审计')}</div>`)+repairPanel(m,scope)+sections;
  }
  let message=null;
  function render(parts) {
    const [,area='plans',id='',sub='']=parts;
    if(!Object.hasOwn(sections,area)||parts.length>4) return inaccessible('plans');
    const db=load();
    const validScope=scope=>!scope||assets.some(a=>allowed(a,scope));
    let html;
    if (id==='new' && area==='plans' && admin() && validScope(sub)) html=planForm(db,null,sub);
    else if (id.startsWith('PL-') && area==='plans') {
      const p=db.plans.find(p=>p.id===id);
      if(p && sub==='edit' && admin()) html=planForm(db,p);
      else if(p && validScope(sub) && visible(checklist(p),sub).length) html=planDetail(db,p,sub);
    } else if(id.startsWith('RUN-') && area!=='plans') {
      const r=db.runs.find(r=>r.id===id);
      if(r && validScope(sub) && visible(r.rows,sub).length) html=area==='reports'?reportDetail(r,sub):runDetail(db,r,sub);
    } else if(!sub && validScope(id)) html=listing(db,area,id);
    if(!html) return inaccessible(area);
    if(message && message.route===location.hash && message.admin===admin()) html+=`<p class="panel" role="status">${esc(message.text)}</p>`;
    message=null;
    return html;
  }
  function feedback(text,route=location.hash) {
    message={route,text,admin:admin()};
    if(route===location.hash) refresh(); else location.hash=route;
  }
  const inputs = (data,k) => String(data.get(k)??'').trim();
  function changePlan(db,f,data,op) {
    const id=f.dataset.id, scope=f.dataset.scope;
    const p={id:id||`PL-${String(db.plans.length+1).padStart(3,'0')}`, name:inputs(data,'name'), owner:inputs(data,'owner'), executor:inputs(data,'executor'), weekday:Number(data.get('weekday')), time:inputs(data,'time'), zone:inputs(data,'zone'),
      assets:assets.map(a=>a.id).filter(id=>data.getAll('asset').includes(id)), checks:Object.keys(checks).filter(c=>data.getAll('check').includes(c))};
    if(!p.name || !p.owner || !Object.hasOwn(accounts,p.executor) || !Object.hasOwn(zones,p.zone) || !Number.isInteger(p.weekday) || !weekdays[p.weekday] || !/^([01]\d|2[0-3]):[0-5]\d$/.test(p.time)) return '请填写计划名称、负责人和有效的执行时间。';
    const rows=checklist(p);
    if(!rows.length || p.assets.some(id=>!rows.some(row=>row.asset===id))) return '请至少选择一个资产，并为每个选中资产匹配适用检查项。';
    const signature=JSON.stringify(p);
    if(op==='preview') {
      f.querySelector('[data-preview]').innerHTML=`<h3 class="foot">保存前预览</h3>${facts([['责任与身份',p.owner+' / '+p.executor],['本周到期',datetime(dueAt(p,week),p.zone)+' · '+p.zone]])}${preview(db,p,'')}`;
      f.dataset.preview=signature; f.querySelector('[value="save"]').disabled=false; return;
    }
    if(op!=='save' || f.dataset.preview!==signature) return '请先预览当前配置。';
    const old=db.plans.find(v=>v.id===id); if(id&&!old)return '计划已不存在。';
    const identityChanged=old && old.executor!==p.executor;
    if(old) db.plans[db.plans.indexOf(old)]=p; else db.plans.unshift(p);
    save(key,db); audit(old?'更新每周计划':'创建每周计划',p.id);
    if(identityChanged) audit('变更巡检执行身份',`${p.id} · ${old.executor} → ${p.executor}`);
    feedback('已保存每周计划。',url('plans',p.id,rows.some(row=>allowed(asset(row.asset),scope))?scope:''));
  }
  function trigger(db,f,data,op) {
    const p=db.plans.find(p=>p.id===f.dataset.id), start=inputs(data,'week');
    if(!p || ![week,nextWeek].includes(start) || !['auto','manual','miss'].includes(op)) return '无效的计划或周期。';
    let r=runFor(db,p,start);
    const existing=!!r;
    if(!r) {
      const mode={auto:'自动到期',manual:'手动执行',miss:'漏跑'}[op], due=dueAt(p,start);
      const at=op==='manual' ? reviewTime+(start===nextWeek?7*day:0) : due+(op==='miss'?day:0);
      r=makeRun(p,start,at); collect(db,r,mode,at); db.runs.unshift(r);
      save(key,db); audit('巡检演练 · '+mode,r.id);
    } else audit('重复触发复用周期运行',r.id);
    const scope=visible(r.rows,f.dataset.scope).length?f.dataset.scope:'';
    feedback(existing?'此周期已冻结，复用原运行和检查结果。':'周期清单已冻结，运行与报告已生成。',url('runs',r.id,scope));
  }
  function environment(db,f,data) {
    const p=db.plans.find(p=>p.id===f.dataset.id), target=inputs(data,'target'), event=inputs(data,'event'), executor=inputs(data,'executor');
    if(!p || !Object.hasOwn(accounts,executor) || ![sourceA,sourceB].includes(target) || !['online','offline','revoke','grant'].includes(event)) return '演练条件无效。';
    if(event==='grant'&&!accounts[executor].includes(target)) return '此身份的授权范围不含该目标，无法恢复。';
    const identityEvent=['grant','revoke'].includes(event), field=identityEvent?'revoked':'offline', value=identityEvent?executor+'@'+target:target;
    db[field]=db[field].filter(v=>v!==value);
    if(event==='offline'||event==='revoke') db[field].push(value);
    const label={online:'Agent 恢复在线',offline:'Agent 离线',grant:'恢复执行身份授权',revoke:'撤销执行身份授权'}[event];
    save(key,db); audit('模拟事件 · '+label,identityEvent?executor+' · '+target:target); feedback(`${target} · ${label}。`);
  }
  function nextSample(r) {
    return Math.max(reviewTime,r.frozen,...r.attempts.map(a=>a.at),...r.repairs.flatMap(c=>[c.at,...c.history.map(h=>h.at)]))+minute;
  }
  function processForm(f,op) {
    const action=f.dataset.inspection, data=new FormData(f), scope=f.dataset.scope;
    if(!admin() && ['plan','trigger','env','makeup'].includes(action)) return '此操作需要平台管理员权限。';
    const db=load();
    if(action==='plan') return changePlan(db,f,data,op);
    if(action==='trigger') return trigger(db,f,data,op);
    if(action==='env') return environment(db,f,data);
    const r=db.runs.find(r=>r.id===f.dataset.id);
    if(!r || !visible(r.rows,scope).length) return '此记录不存在或超出当前权限。';
    if(action==='download') {
      const m=reportModel(r,scope); download(r.id+'.json',JSON.stringify(m,null,2),'application/json;charset=utf-8'); audit('下载巡检报告',r.id); return;
    }
    if(action==='makeup') {
      if(!visible(r.rows,scope).some(row=>row.status==='漏检')) return '此范围已无待补漏项。';
      collect(db,r,'补检',nextSample(r),scope); save(key,db); audit('补检原周期漏项',r.id); feedback('补检回执已记入原周期。'); return;
    }
    const id=inputs(data,'asset');
    if(!visible(r.rows,scope).some(row=>row.asset===id&&row.check==='V1'&&row.status==='发现')) return '当前范围无此发现。';
    const change=r.repairs.find(entry=>entry.asset===id);
    const at=nextSample(r), actor=admin()?'平台管理员':'目标操作员';
    if(action==='repair') {
      const memo=inputs(data,'memo'); if(!memo || memo.length>180 || change) return '请填写有效说明，每条发现只需登记一次。';
      r.repairs.push({asset:id,issue,beforeVersion:baseline,fixedVersion:fixed,at,actor,memo,history:[]});
      save(key,db); audit('登记巡检修复',`${r.id} · ${id} · ${issue}`); feedback('修复已登记，可比较部署版本。'); return;
    }
    if(action==='recheck' && change) {
      const version=inputs(data,'version');
      if(version && !/^\d{1,5}\.\d{1,5}\.\d{1,5}$/.test(version)) return '版本须包含三段数字，例如 2.10.0。';
      const reason=obstacle(db,r.plan.executor,asset(id)) || (!version?'缺少部署版本回执':'');
      let result='无法验证';
      if(!reason) {
        const values=version.split('.').map(Number), threshold=fixed.split('.').map(Number);
        const diff=values.map((n,i)=>n-threshold[i]).find(n=>n!==0)??0;
        result=diff>=0?'已修复':'仍受影响';
      }
      change.history.push({at,actor,version:reason?null:version,result,evidence:reason||`${asset(id).source} · 部署 ${version}，修复线 ${fixed}`});
      save(key,db); audit('巡检版本复检 · '+result,`${r.id} · ${id} · ${issue}`); feedback('复检结果已保存 · '+result); return;
    }
    return '无可执行操作。';
  }
  document.addEventListener('submit',event=>{
    const f=event.target; if(!f.matches('form[data-inspection]'))return;
    event.preventDefault(); const error=processForm(f,event.submitter?.value);
    if(f.isConnected) f.querySelector('[data-error]').textContent=error||'';
  });
  document.addEventListener('input',event=>{
    const f=event.target.closest('form[data-inspection="plan"]'); if(!f || !f.dataset.preview)return;
    delete f.dataset.preview; f.querySelector('[data-preview]').replaceChildren(); f.querySelector('[value="save"]').disabled=true;
  });
  document.addEventListener('change',event=>{
    const s=event.target; if(s.matches('select[data-inspect-filter]')) location.hash=url(s.dataset.inspectFilter,s.value);
  });
  return {render,summary};
})();

</script>

<script>
'use strict';
const navSections = [['platform','平台看板'],['machines','机器'],['clusters','K8s 集群'],['systems','业务系统'],['inspection/plans','巡检']];
const diagTools = {k8s:'Kubernetes',database:'数据库',website:'网站',credentials:'凭据',audit:'审计'};
function simpleHead(name) {return `<nav class="crumbs"><a href="#platform">资产</a> › ${Review.esc(name)}</nav><h1 tabindex="-1">${Review.esc(name)}</h1>`;}
function missingPage(message='当前入口不存在，或不在此身份的可见范围。') {return `${simpleHead('无法打开')}<section class="panel" role="alert">${Review.esc(message)} <a href="#platform">返回平台看板</a></section>`;}
function coverageCard(kind,name,unit) {
  const {covered,total}=Inventory.coverage(kind), pct=total ? Math.round(covered/total*1000)/10 : null;
  const gap=Math.max(0,Math.ceil(total*.8)-covered), passed=total>0 && gap===0;
  return `<article class="coverage ${passed?'':'below'}"><div class="bar"><h3>${name}</h3><strong>${pct===null?'—':pct+'<small>%</small>'}</strong></div><div class="rail" aria-hidden="true"><i style="width:${pct||0}%"></i></div><div class="bar"><span>已覆盖 <b>${covered} / ${total}</b> ${unit}</span><small class="${passed?'ok':'warn'}">${!total?'无适用资产':passed?'已达标':'距目标差 '+gap+' '+unit}</small></div><a class="go foot" href="#coverage/${kind}">查看${name}覆盖明细 →</a></article>`;
}
function platformPage() {
  const clusters=Cluster.list(), alerts=Monitor.summary(), run=Inspection.summary();
  const rows=clusters.map(c=>{
    const counts=Inventory.clusterCounts(c.id), weekly=Inspection.summary(c.id);
    return `<tr><td><a class="go" href="#${encodeURIComponent(c.id)}/overview/all">${Review.esc(c.name)}</a><small>${Review.esc(c.asset)}</small></td><td>${counts.machines} 台 / ${counts.systems} 个</td><td>${Number(c.sourceCount)} / ${Number(c.namespaceCount)}</td><td>${c.online?'在线':'离线'}<small>${Review.esc(c.lastVerified)}</small></td><td>${weekly.planned?weekly.completed+' / '+weekly.planned:'暂无应检资产'}</td></tr>`;
  }).join('');
  const standalone=Inventory.unclustered();
  const standaloneList=standalone.map(asset=>`<li><a href="#machines/${encodeURIComponent(asset.id)}">${Review.esc(asset.name)}</a><small>${Review.esc(asset.reason)}</small></li>`).join('');
  return simpleHead('平台看板')+`<div class="bar"><strong>${Review.admin()?'平台汇总':'我的可见范围'}</strong><small>盘点基准日 2026-11-19 · 当前 Gateway</small></div>
  <section class="panel"><div class="group-title"><h2>拓扑覆盖率</h2><small>服务器、业务系统分别验收 · 目标 80%</small></div><div class="pair">${coverageCard('machines','在役服务器','台')}${coverageCard('systems','在役业务系统','个')}</div></section>
  <section class="overview-row" aria-label="值班摘要"><a href="#monitor/alerts"><span>未恢复异常</span><strong>${alerts.open}</strong><small>另有 ${alerts.missing} 项采集中断</small></a><a href="#inspection/reports"><span>本周实检 / 应检</span><strong>${run.completed} / ${run.planned}</strong><small>本周漏检 ${run.missed} · 查看报告</small></a><a href="#topology"><span>平台拓扑</span><strong>${clusters.length} 个集群</strong><small>查看业务依赖、部署与物理承载 →</small></a></section>
  <div class="tables"><section class="panel"><div class="group-title"><h2>集群对比</h2><a href="#clusters">查看集群台账</a></div><div class="table-scroll"><table><thead><tr><th>集群</th><th>机器 / 系统</th><th>来源 / 命名空间</th><th>连接 / 最近核验</th><th>本周实检 / 应检</th></tr></thead><tbody>${rows}</tbody></table></div></section>
  <section class="panel"><div class="group-title"><h2>未关联集群的机器</h2><small>${standalone.length} 台</small></div>${standaloneList?`<ul class="impact-list">${standaloneList}</ul>`:'<p class="note">当前授权范围内没有可见的未关联机器。</p>'}</section></div>`;
}
const diagSources={'prod-east/agent-a':['orders','shared-data'],'prod-east/agent-b':['billing','shared-data'],'stage-west/agent-c':['staging']};
function allowedSources() {return Review.admin()?Object.keys(diagSources):['prod-east/agent-a'];}
function diagnosticPage(parts) {
  const [,tool,requested,scope='',object='']=parts;
  if (!Object.hasOwn(diagTools,tool)) return missingPage();
  if(tool==='audit') {
    const actor=Review.admin()?'平台管理员':'目标操作员';
    const rows=Review.read('audit-events',[]).filter(e=>Review.admin()||e.actor===actor);
    return simpleHead('操作审计')+`<section class="panel"><div class="group-title"><h2>本次评审记录</h2><small>${Review.admin()?'全部演练操作':'我的演练操作'} · ${rows.length} 条</small></div>${rows.length?`<div class="table-scroll"><table><thead><tr><th>时间</th><th>身份</th><th>动作</th><th>对象</th></tr></thead><tbody>${rows.map(e=>`<tr><td>${Review.esc(new Date(e.at).toLocaleString('zh-CN',{timeZone:'Asia/Shanghai',hour12:false}))}</td><td>${Review.esc(e.actor)}</td><td>${Review.esc(e.action)}</td><td>${Review.esc(typeof e.object==='string'?e.object:JSON.stringify(e.object))}</td></tr>`).join('')}</tbody></table></div>`:'<p>暂无操作。完成一次录入、巡检或诊断后可回看记录。</p>'}</section>`;
  }
  const sources=allowedSources(), src=requested||sources[0];
  if(!sources.includes(src)||scope && !diagSources[src].includes(scope)||!Review.admin() && /billing|stage-west/i.test(object)) return missingPage();
  const offline=src.startsWith('stage-west/');
  const options=sources.map(s=>`<option ${s===src?'selected':''}>${Review.esc(s)}</option>`).join('');
  const result={k8s:'Deployment 已就绪 2/2，关联 Pods 运行中。',database:'PostgreSQL 接受只读连接，连接数 34，磁盘使用量 80 GiB。',website:'健康端点返回 200，预期服务标识匹配，耗时 38 毫秒。',credentials:'当前目标绑定 1 个有效凭据引用；可用版本为 active。'}[tool];
  return simpleHead(diagTools[tool]+' · 目标诊断')+`<nav class="tabs" aria-label="诊断工具">${Object.entries(diagTools).map(([id,n])=>`<a href="${id==='audit'?'#diagnose/audit':Review.diagnostic(id,src,scope,object)}" ${tool===id?'aria-current="page"':''}>${n}</a>`).join('')}</nav><section class="panel"><h2>执行上下文</h2><dl class="facts"><dt>来源目标</dt><dd><select id="diag-source" aria-label="来源目标">${options}</select></dd><dt>命名空间</dt><dd>${Review.esc(scope||'目标范围')}</dd><dt>资产</dt><dd>${Review.esc(object||'所选目标')}</dd><dt>通道</dt><dd>${offline?'离线 · 实时诊断不可用':'在线'}</dd></dl><button id="diag-run" ${offline?'disabled':''}>${tool==='credentials'?'查看绑定元数据':'运行示例诊断'}</button><div class="foot" role="status" id="diag-result" data-result="${Review.esc(result)}"></div></section>`;
}
function wireDiagnostics(parts) {
  const select=document.querySelector('#diag-source'); if(!select) return;
  select.onchange=()=>{location.hash=Review.diagnostic(parts[1],select.value,'','');};
  const btn=document.querySelector('#diag-run');
  btn.onclick=()=>{const el=document.querySelector('#diag-result');el.textContent='示例回执 · '+el.dataset.result;Review.audit('查看'+diagTools[parts[1]]+'诊断回执',select.value);};
}
function getParts() {return (location.hash.slice(1)||'platform').split('/').map(decodeURIComponent);}
let previousHash;
function renderReview() {
  const work=document.getElementById('work'); let parts,html,navKey;
  try {parts=getParts();} catch(error){parts=['invalid'];}
  const [area]=parts;
  if(area==='platform'){html=platformPage();navKey='platform';}
  else if(['machines','systems','coverage'].includes(area)){html=Inventory.render(parts);navKey=area==='coverage'?'platform':area;}
  else if(area==='inspection'){html=Inspection.render(parts);navKey='inspection/plans';}
  else if(area==='monitor'){html=Monitor.render(parts);navKey='clusters';}
  else if(area==='diagnose'){html=diagnosticPage(parts);navKey='diagnose';}
  else if(area==='topology'||area==='clusters'||Cluster.list().some(c=>c.id===area)){html=Cluster.render(parts);navKey=area==='topology'?'platform':'clusters';}
  else {html=missingPage();}
  work.innerHTML=html;
  if(area==='diagnose') wireDiagnostics(parts);
  document.getElementById('main-nav').innerHTML=navSections.map(([id,name])=>`<a href="#${id}" ${id===navKey?'aria-current="page"':''}>${name}</a>`).join('') + '<a href="#diagnose/audit" '+(area==='diagnose'?'aria-current="page"':'')+'>审计</a>';
  const back=document.getElementById('prev-view');back.hidden=!backRoute; document.getElementById('review-role').value=Review.admin()?'admin':'operator';
  document.title=(work.querySelector('h1,h2')?.textContent.trim()||'资产')+' · DoOps 功能评审';
  if(previousHash!==location.hash){window.scrollTo(0,0);const title=work.querySelector('h1,h2');if(title){title.tabIndex=-1;title.focus({preventScroll:true});}}
  previousHash=location.hash;
}
let currentRoute=location.hash,backRoute='';
window.addEventListener('hashchange',()=>{backRoute=currentRoute||'#platform';currentRoute=location.hash;renderReview();});
document.getElementById('prev-view').onclick=()=>history.back();
document.getElementById('review-role').onchange=e=>{Review.save('review-role',e.target.value);backRoute='';if(location.hash!=='#platform'){location.replace('#platform');}else{renderReview();}};
renderReview();

</script>
</body>
</html>
