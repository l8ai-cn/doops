<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; img-src data:; style-src 'unsafe-inline'; script-src 'unsafe-inline'; connect-src 'none'; base-uri 'none'; form-action 'none'">
  <title>平台看板 · DoOps 资产评审原型</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: oklch(.16 .012 250); --card: oklch(.2 .014 250); --muted: oklch(.25 .012 250);
      --fg: oklch(.92 .006 250); --sub: oklch(.65 .01 250); --line: oklch(.3 .014 250);
      --primary: oklch(.72 .13 175); --warning: oklch(.78 .13 75);
      --tint: color-mix(in oklch, var(--primary) 10%, var(--card));
      --mono: "Geist Mono", ui-monospace, SFMono-Regular, Menlo, monospace;
    }
    * { box-sizing: border-box; }
    body { margin: 0; font: 14px/1.5 "Geist", system-ui, sans-serif; color: var(--fg); background: var(--bg); }
    h1,h2,h3,p,dl,dd { margin: 0; }
    h1 { font-size: 24px; line-height: 1.3; }
    h2 { font-size: 16px; } h3 { font-size: 14px; }
    a { color: var(--primary); text-decoration-thickness: 1px; text-underline-offset: 4px; }
    a:hover { text-decoration: underline; }
    :focus-visible { outline: 2px solid var(--primary); outline-offset: 3px; }
    [tabindex="-1"]:focus { outline: none; }
    small,.note,time { font-size: 12px; color: var(--sub); }
    code,.num { font-family: var(--mono); font-variant-numeric: tabular-nums; }
    code { font-size: .94em; overflow-wrap: anywhere; }
    header,.bar,.heading,.group-title,.tabs,.graph-head,.crumbs { display: flex; align-items: center; flex-wrap: wrap; gap: 8px; }
    header { padding: 12px 16px; border-bottom: 1px solid var(--line); background: var(--card); }
    header img { width: 72px; height: auto; }
    .product { border-left: 1px solid var(--line); padding-left: 12px; margin-left: 4px; font-weight: 600; }
    .review { margin-left: auto; font-size: 12px; color: var(--sub); }
    main { padding: 16px; display: grid; gap: 16px; }
    .crumbs { color: var(--sub); font-size: 12px; }
    .crumbs a { color: inherit; } .crumbs b { color: var(--fg); font-weight: 500; }
    .heading,.group-title,.graph-head { justify-content: space-between; }
    .heading { gap: 12px; align-items: end; }
    .heading p { margin-top: 4px; }
    .panel { min-width: 0; padding: 16px; border: 1px solid var(--line); background: var(--card); border-radius: 14px; }
    .group-title { margin-bottom: 16px; }
    .count { margin-left: 5px; font: 12px var(--mono); color: var(--sub); }
    .pair,.tables,.graph-layout { display: grid; gap: 16px; grid-template-columns: repeat(2,minmax(0,1fr)); }
    .tables { grid-template-columns: minmax(0,1.35fr) minmax(0,1fr); align-items: start; }
    .coverage { padding: 16px; border: 1px solid var(--line); border-radius: 10px; }
    .coverage .bar { justify-content: space-between; align-items: baseline; }
    .coverage strong { font: 600 32px/1.25 var(--mono); letter-spacing: -.04em; }
    .coverage strong small { font-size: 16px; color: inherit; }
    .rail { position: relative; height: 6px; background: var(--muted); border-radius: 4px; margin: 16px 0 12px; }
    .rail i { display: block; background: var(--primary); height: 100%; border-radius: inherit; }
    .below .rail i { background: var(--warning); }
    .rail::after { content: ''; position: absolute; left: 80%; top: -3px; height: 12px; border-left: 2px solid var(--fg); }
    .ok { color: var(--primary); } .warn { color: var(--warning); }
    .foot { margin-top: 12px; }
    table { border-collapse: collapse; width: 100%; text-align: left; font-variant-numeric: tabular-nums; }
    th,td { padding: 10px 8px; border-bottom: 1px solid var(--line); vertical-align: middle; }
    th:first-child,td:first-child { padding-left: 0; }
    th:last-child,td:last-child { padding-right: 0; }
    th { color: var(--sub); font-size: 12px; font-weight: 500; } tbody tr:last-child td { border-bottom: 0; }
    td small { display: block; }
    .go { display: inline-flex; align-items: center; gap: 8px; min-height: 32px; font-weight: 600; }
    .tabs { border-bottom: 1px solid var(--line); gap: 16px; }
    .tabs a,.tabs span { display: inline-flex; min-height: 44px; padding: 8px 4px; align-items: center; border-bottom: 2px solid transparent; }
    .tabs a { text-decoration: none; color: var(--sub); }
    .tabs [aria-current] { color: var(--primary); border-color: var(--primary); }
    .scope { display: flex; gap: 8px; align-items: center; font-size: 12px; color: var(--sub); }
    select,.node { font: inherit; color: var(--fg); background: var(--bg); border: 1px solid var(--line); border-radius: 8px; }
    select { min-height: 36px; padding: 4px 8px; }
    .metrics { display: grid; grid-template-columns: repeat(6,minmax(0,1fr)); gap: 12px 0; }
    .reading { border-left: 1px solid var(--line); padding: 0 12px; }
    .reading:first-child { border: none; padding-left: 0; }
    .reading strong { display: block; font: 600 21px/1.6 var(--mono); }
    .reading .missing { color: var(--warning); font: 600 16px/2.1 system-ui,sans-serif; }
    .sources { margin-bottom: 8px; } .sources strong { color: var(--primary); }
    .graph-layout { grid-template-columns: minmax(0,1.55fr) minmax(270px,1fr); align-items: start; }
    .graph-head { margin-bottom: 12px; }
    .plot { display: grid; grid-template-columns: minmax(0,1fr) 48px minmax(0,1fr); align-items: center; padding: 32px 16px; background: var(--bg); border: 1px solid var(--line); border-radius: 8px; }
    .apps { display: grid; gap: 16px; }
    .node { display: grid; position: relative; align-content: center; gap: 2px; min-height: 72px; padding: 8px 12px; background: var(--card); text-decoration: none; }
    .node small { font-size: 12px; overflow-wrap: anywhere; }
    .node:hover,.node[aria-current] { border-color: var(--primary); background: var(--tint); text-decoration: none; }
    .node[aria-current] b { color: var(--primary); }
    .apps .node::after,.wire::after,.wire::before { content: ''; position: absolute; border-color: var(--sub); }
    .apps .node::after { width: 24px; left: calc(100% + 1px); top: 50%; border-top: 1px solid var(--sub); }
    .wire { position: relative; align-self: stretch; }
    .wire::after { left: 50%; right: 0; top: 50%; border-top: 1px solid var(--sub); }
    .fork::before { left: 50%; height: calc(50% + 8px); top: 50%; transform: translateY(-50%); border-left: 1px solid var(--sub); }
    .db.connected::before { content: ''; position: absolute; left: -7px; top: calc(50% - 3px); width: 5px; height: 5px; transform: rotate(45deg); border-top: 1px solid var(--sub); border-right: 1px solid var(--sub); }
    .solo { grid-template-columns: 1fr; }
    .facts { display: grid; grid-template-columns: auto minmax(0,1fr); gap: 8px 16px; margin: 16px 0; }
    dt { color: var(--sub); }
    .action { display: inline-flex; align-items: center; justify-content: center; padding: 6px 12px; min-height: 36px; color: var(--bg); background: var(--primary); border-radius: 8px; font-weight: 600; text-decoration: none; }
    .back { display: inline-flex; align-items: center; margin-left: 8px; min-height: 36px; }
    .impact-list { list-style: none; padding: 0; margin: 12px 0; }
    .impact-list li { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; padding: 8px 0; border-top: 1px solid var(--line); }
    @media(max-width:900px) { .tables,.graph-layout { grid-template-columns: 1fr; } .metrics { grid-template-columns: repeat(3,minmax(0,1fr)); } .reading:nth-child(4) { border: none; padding-left: 0; } }
    @media(max-width:640px) {
      main { padding: 12px; gap: 12px; } .panel,.coverage { padding: 12px; } .pair { grid-template-columns: 1fr; gap: 8px; }
      .group-title { margin-bottom: 12px; } .scope,select,.go,.action,.back,.crumbs a { min-height: 44px; } .crumbs a { display: inline-flex; align-items: center; }
      .metrics { grid-template-columns: repeat(2,minmax(0,1fr)); } .reading:nth-child(odd) { border: none; padding-left: 0; } .reading:nth-child(even) { border-left: 1px solid var(--line); padding-left: 12px; }
      .plot { padding: 20px 8px; } .node { padding: 8px; } .heading { align-items: flex-start; }
      td,th { padding: 8px 4px; } th { white-space: nowrap; } td { font-size: 13px; }
    }
    @media(pointer:coarse) { a.go,a.action,a.back,select,.crumbs a { min-height: 44px; } .crumbs a { display: inline-flex; align-items: center; } }
  #main-nav {display:flex;flex-wrap:wrap;gap:6px;align-items:center;padding:8px 16px;background:var(--card);border-bottom:1px solid var(--line)}
#main-nav a {padding:6px 10px;border:1px solid transparent;border-radius:7px;color:var(--sub);text-decoration:none;min-height:34px;display:inline-flex;align-items:center}
#main-nav a[aria-current="page"]{background:var(--tint);border-color:var(--line);color:var(--primary)}
header .role-switch {font-size:12px;color:var(--sub);display:flex;gap:6px;align-items:center}
main > *,fieldset,article,section,aside,form,div {min-width:0} main:focus{outline:none}
main button,main input,main textarea,main select {max-width:100%;font:inherit;color:var(--fg);background:var(--bg);border:1px solid var(--line);border-radius:7px;padding:6px 9px}
main button{cursor:pointer} main button:hover,#main-nav a:hover{background:var(--muted)}main button:disabled{opacity:.55;cursor:not-allowed} input[type=checkbox],input[type=radio]{accent-color:var(--primary);width:auto}main textarea{width:100%;min-height:100px}main .action{color:var(--bg);background:var(--primary)}
fieldset{border:1px solid var(--line);padding:12px;border-radius:8px}details summary{cursor:pointer;color:var(--primary)} form label{line-height:1.8}
.overview-row{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}.overview-row a{display:grid;gap:5px;padding:13px 16px;border:1px solid var(--line);border-radius:9px;background:var(--card);color:var(--fg);text-decoration:none}.overview-row strong{font:600 23px var(--mono);color:var(--primary)} .overview-row a:hover{border-color:var(--primary)}
.coverage .go{font-size:13px} .toolbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.review-alert{padding:12px;border:1px solid var(--warning);color:var(--warning);border-radius:8px} pre{white-space:pre-wrap;overflow-wrap:anywhere}.panel{overflow-wrap:break-word}.table-scroll{overflow-x:auto}
@media(max-width:640px){.overview-row{grid-template-columns:1fr}#main-nav{padding:4px 8px;gap:0}#main-nav a,main button{min-height:42px}.panel{overflow-x:auto} .panel th{white-space:normal} pre{max-width:100%} .review{margin-left:0} }
</style>

<script>
'use strict';
window.Review = (() => {
  const prefix = 'doops.asset-review.v2.';
  const esc = value => String(value ?? '').replace(/[&<>"']/g, ch => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]));
  function read(key, initial) {
    const raw = localStorage.getItem(prefix + key);
    return raw === null ? initial : JSON.parse(raw);
  }
  function save(key,value) {localStorage.setItem(prefix + key,JSON.stringify(value));}
  function admin() {return read('review-role','admin') === 'admin';}
  function download(name,content,type) {
    const blob = content instanceof Blob ? content : new Blob([content],{type:type || 'text/plain;charset=utf-8'});
    const url = URL.createObjectURL(blob), link = document.createElement('a');
    link.href = url; link.download = name; document.body.append(link); link.click(); link.remove(); setTimeout(() => URL.revokeObjectURL(url),1500);
  }
  function audit(action,object) {
    const entries=read('audit-events',[]);
    entries.unshift({action:String(action),object:String(object),at:new Date().toISOString(),actor:admin()?'平台管理员':'目标操作员'});
    save('audit-events',entries);
  }
  function diagnostic(tool,source,namespace,object) {return '#diagnose/'+[tool,source,namespace,object].map(value=>encodeURIComponent(value||'')).join('/');}
  return {esc,read,save,admin,download,audit,diagnostic,refresh:()=>renderReview()};
})();

</script>

      row.owner=get('owner');if(!row.owner) return error(form,'请填写系统负责人。');
      const rels=[...form.querySelectorAll('[data-inv-rel]')].map(field=>{
        const val=k=>field.querySelector(`[name="${k}"]`).value.trim();
        return {app:val('app'),source:val('relSource'),ns:val('ns'),db:val('db')};
      });
      const used=new Set();
      for(const r of rels){
        if(!assetId.test(r.app) || !assetId.test(r.ns) || (r.db && !assetId.test(r.db)) || !targets.includes(r.source)) return error(form,'请核对每条部署的应用标识、目标、命名空间和数据库标识。');
        const ident=[r.app,r.source,r.ns].join('/');
        if(used.has(ident)) return error(form,'同一应用在相同目标和命名空间的部署已重复。');used.add(ident);
        const same=old?.relations.find(x=>x.app===r.app && x.source===r.source && x.ns===r.ns && x.db===r.db);r.verified=same?.verified || '';
      }
      row.relations=rels;
    }
    storeRecord(state,kind,row);R().audit(old?'编辑'+labels[kind]:'登记'+labels[kind],id);
    const target=`${kind}/${id}`;resetView();const note=`已保存${labels[kind]} ${id}。`;
    if(route===target){message=note;R().refresh();}else{nextMessage={route:target,text:note};location.hash=target;}
  }
  function verify(button){
    if(!admin()) return R().refresh();
    const [kind,id]=path();if(kind!=='systems' || !id) return;
    const state=read(),sys=current(kind,state).find(s=>s.asset_id===id),r=sys?.relations[Number(button.dataset.index)];
    if(!r || r.verified || JSON.stringify(r)!==button.dataset.relation){message='部署关系已变化，请核对后重试。';return R().refresh();}
    if(r.source===C){message='来源处于离线状态，待恢复后核验。';return R().refresh();}
    const replacement={...sys,relations:sys.relations.map(rel=>rel===r?{...r,verified:stamp()}:rel)};
    storeRecord(state,kind,replacement);R().audit('核验部署来源',`${id} · ${r.app} · ${r.source} · ${r.ns}`);message=`已核验 ${r.app} 在 ${r.source} 的部署关系。`;R().refresh();
  }
  const sampleCsv=[columns.join(','),'demo-vm,报表虚拟机,vm,,4,16,120,demo-host','demo-host,示例宿主,physical,,32,128,512,','demo-vm,报表虚拟机,vm,,4,16,120,demo-host','demo-fix,待修正机器,physical,,8,-1,200,'].join('\n');
  function parseCsv(text){
    const records=[];let cells=[],value='',quoted=false,closed=false,line=1,start=1;
    function endField(){cells.push(value.trim());value='';closed=false;}
    function endRecord(){endField();if(cells.length>1 || cells[0]) records.push({line:start,cells});cells=[];}
    const input=text.replace(/^\uFEFF/,'').replace(/\r\n?/g,'\n');
    for(let i=0;i<input.length;i++){
      const ch=input[i];
      if(quoted){
        if(ch==='"'){if(input[i+1]==='"'){value+='"';i++;}else{quoted=false;closed=true;}}
        else{value+=ch;if(ch==='\n') line++;}
      }else if(ch===',') endField();
      else if(ch==='\n'){endRecord();start=++line;}
      else if(closed) throw Error(`第 ${line} 行引号后含多余字符。`);
      else if(ch==='"'){if(value) throw Error(`第 ${line} 行字段中的引号应成对转义。`);quoted=true;}
      else value+=ch;
    }
    if(quoted) throw Error(`第 ${start} 行的引号未闭合。`);endRecord();
    const header=records.shift()?.cells || [];
    if(header.length!==new Set(header).size) throw Error('表头含重复列，请校正列名。');
    for(const k of columns.slice(0,3)) if(!header.includes(k)) throw Error(`表头缺少必填列 ${k}。`);
    for(const k of header) if(!columns.includes(k)) throw Error(`未知列 ${k}，请对照 CSV 列名修正。`);
    if(!records.length) throw Error('只有表头，请至少填写一行机器记录。');
    return records.map(({cells,line})=>{
      const row={...blankMachine(),...Object.fromEntries(header.map((k,i)=>[k,cells[i] || '']))};
      const issue=cells.length!==header.length?'列数与表头不一致，请核对逗号和引号':machineIssue(row);
      return {line,row:issue?row:normalize(row),issue};
    });
  }
  function assess(csv,state){
    const rows=parseCsv(csv), existing=new Map(current('machines',state).map(m=>[m.asset_id,m]));
    const grouped=new Map();
    for(const entry of rows){const id=entry.row.asset_id;if(!grouped.has(id)) grouped.set(id,[]);grouped.get(id).push(entry);}
    const hosts=new Map(existing);
    for(const [id,entries] of grouped){
      const first=entries[0].row, old=existing.get(id);
      const different=columns.filter(k=>entries.some(({row})=>row[k]!==first[k]));
      for(const [i,entry] of entries.entries()){
        const diff=old?columns.filter(k=>old[k]!==entry.row[k]):[];
        if(different.length) entry.issue=`批内同编号字段冲突（${different.join('、')}），请统一后重试`;
        else if(diff.length) entry.issue=`与台账字段冲突（${diff.join('、')}），请核对原记录`;
        entry.status=entry.issue?'error':old || i?'duplicate':'new';
        entry.detail=entry.issue || (old?'台账已有相同记录':i?'同批已有相同记录':entry.row.host_asset_id?`宿主 ${entry.row.host_asset_id}`:'验证通过');
      }
      if(entries[0].status==='new' && first.kind==='physical') hosts.set(id,first);
    }
    for(const entry of rows){
      const issue=hostIssue(entry.row,hosts);
      if(issue && entry.status!=='error'){entry.status='error';entry.detail=issue;}
    }
    return rows;
  }
  const statusText={new:'可新增',duplicate:'重复跳过',error:'行错误',imported:'已新增'};
  const receiptRows=entries=>entries.map(({line,row,status,detail})=>({line,id:row.asset_id,status,detail}));
  function receiptTable(rows){
    const counts=Object.keys(statusText).map(k=>[k,rows.filter(r=>r.status===k).length]).filter(([,n])=>n);
    return `<p class="foot" role="status">共 ${rows.length} 行 · ${counts.map(([k,n])=>`${statusText[k]} ${n}`).join(' · ')}</p>`+tbl(['CSV 行号','资产编号','结果','说明'],rows.map(r=>[e(r.line),e(r.id || '—'),`<span class="${r.status==='error'?'warn':'ok'}">${statusText[r.status]}</span>`,e(r.detail)]));
  }
  function importPage(){
    return crumb('machines','机器台账','CSV 导入')+heading('CSV 导入机器','先核对逐行预览，再确认写入本地台账。')+panel('选择文件或粘贴 CSV',`<form onsubmit="event.preventDefault();Inventory.previewCsv(this)"><div class="toolbar"><label>UTF-8 文件 <input type="file" accept=".csv,text/csv" name="file" onchange="Inventory.loadCsv(this)"></label>${btn('填入示例','sample(this.form)')}</div><label>CSV 内容<textarea name="csv" rows="6" spellcheck="false" placeholder="${e(columns.join(','))}" oninput="Inventory.invalidateCsv(this.form)"></textarea></label><p class="note">必填 asset_id、name、kind。类型填 physical 或 vm，host_asset_id 可指向本批次内的物理机。</p>${formError}<div class="toolbar foot"><button type="submit" class="action">预览 CSV</button>${modeBtn('取消','')}</div><div data-preview aria-live="polite"></div></form>`);
  }
  function invalidateCsv(form){preview=null;form.querySelector('[data-preview]').replaceChildren();form.querySelector('[data-inv-error]').textContent='';}
  function sample(form){if(!admin()) return;invalidateCsv(form);form.elements.file.value='';form.elements.csv.disabled=false;form.elements.csv.value=sampleCsv;}
  async function loadCsv(input){
    if(!admin()) return;const form=input.form,file=input.files[0];invalidateCsv(form);form.elements.csv.value='';if(!file){form.elements.csv.disabled=false;return;}
    const box=form.elements.csv;box.disabled=true;form.querySelector('[data-inv-error]').textContent='正在读取文件…';
    try{const text=new TextDecoder('utf-8',{fatal:true}).decode(await file.arrayBuffer());if(!admin() || !form.isConnected || input.files[0]!==file) return;box.value=text;form.querySelector('[data-inv-error]').textContent='文件已读取，请预览。';}
    catch{if(form.isConnected && input.files[0]===file) error(form,'无法读取 UTF-8 文本，请检查文件编码后重新上传。');}
    finally{if(input.files[0]===file) box.disabled=false;}
  }
  function previewCsv(form){
    if(!admin() || mode!=='import') return R().refresh();invalidateCsv(form);
    try{
      const text=form.elements.csv.value, entries=assess(text,read()),rows=receiptRows(entries),add=entries.filter(r=>r.status==='new');
      preview={text,rows};const hostCount=add.filter(x=>x.row.host_asset_id).length;
      form.querySelector('[data-preview]').innerHTML=`<h3 class="foot">逐行预览</h3>${receiptTable(rows)}${hostCount?`<label><input name="approveHosts" type="checkbox"> 已核对 ${hostCount} 条 VM 与宿主关系</label>`:''}<div class="foot">${btn(`仅导入可新增的 ${add.length} 行`,'commitCsv(this.form)',true,add.length?'':'disabled')}</div>`;
    }catch(err){error(form,err.message);}
  }
  function commitCsv(form){
    if(!admin() || mode!=='import') return R().refresh();
    if(!preview || form.elements.csv.value!==preview.text) return error(form,'内容已变化，请重新预览。');
    const state=read(),entries=assess(preview.text,state),rows=receiptRows(entries);
    if(JSON.stringify(rows)!==JSON.stringify(preview.rows)){invalidateCsv(form);return error(form,'台账自预览后已变化，请重新预览并核对本次新增。');}
    const add=entries.filter(r=>r.status==='new');if(!add.length) return error(form,'没有可新增行。');
    if(add.some(r=>r.row.host_asset_id) && !form.elements.approveHosts?.checked) return error(form,'请先勾选并确认 VM 与宿主的承载关系。');
    const at=stamp(),id='IMP-'+crypto.randomUUID();
    state.machines.push(...add.map(({row})=>({...row,hostVerified:row.host_asset_id?at:''})));
    for(const row of rows) if(row.status==='new') row.status='imported';
    state.batches.unshift({id,at,rows});
    try{R().save(key,state);}catch{return error(form,'本地存储写入失败，请检查浏览器存储空间后重试。');}
    R().audit('导入机器',`${id} · 新增 ${add.length} 台`);resetView();mode='batches';batchId=id;message=`导入完成，已新增 ${add.length} 台机器。`;R().refresh();
  }
  function lookupBatch(id){if(!admin()) return R().refresh();batchId=String(id).trim();message='';R().refresh();}
  function batchesPage(){
    const batches=read().batches, batch=batches.find(r=>r.id===batchId);
    const choice=tbl(['批次号','确认时间（UTC+8）','处理行数'],batches.map(b=>[btn(b.id,'lookupBatch(this.dataset.id)',false,`data-id="${e(b.id)}" style="overflow-wrap:anywhere"`),e(clock(b.at)),e(b.rows.length)]),'还没有已确认的导入批次。');
    return crumb('machines','机器台账','导入批次')+heading('机器导入批次','按批次号回查逐行处理结果。',modeBtn('返回机器台账',''))+notice()+panel('查询回执',`<form class="toolbar" onsubmit="event.preventDefault();Inventory.lookupBatch(this.elements.batch.value)"><label>批次号 <input required name="batch" value="${e(batchId)}"></label><button>查询批次</button></form>${batch?`<p class="foot"><code>${e(batch.id)}</code> · ${e(clock(batch.at))}</p>${receiptTable(batch.rows)}`:batchId?'<p class="warn foot" role="status">找不到此批次，请核对批次号。</p>':''}`)+panel('已确认批次',choice);
  }
  const statusOptions=[['gap','全部缺口'],['all','全部基线资产'],['covered','已覆盖'],['关系待核验','关系待核验'],['缺少关系','缺少关系']];
  function reportRows(kind){
    const q=query();return reconciliation(kind,date).filter(r=>(q.status==='all' || (q.status==='gap' && !r.covered) || (q.status==='covered' && r.covered) || q.status===r.reason) && searchMatch(q.search,[r.id,r.name,r.source,r.detail]));
  }
  function coverageCard(kind,rows){
    const {covered,total}=count(rows), missing=Math.max(0,Math.ceil(total*0.8)-covered), percent=total?Math.round(1000*covered/total)/10:0,unit=kind==='machines'?'台':'个';
    return `<article class="coverage ${missing?'below':''}"><div class="bar"><h3>${kind==='machines'?'在役服务器':'在役业务系统'}</h3><strong>${total?`${percent}<small>%</small>`:'—'}</strong></div><div class="rail" aria-hidden="true"><i style="width:${percent}%"></i></div><div class="bar"><span>已覆盖 <b>${covered} / ${total}</b> ${unit}</span><small class="${missing?'warn':'ok'}">${!total?'无适用资产':missing?`距 80% 差 ${missing} ${unit}`:'已达 80% 目标'}</small></div></article>`;
  }
  const baselineLabel=()=>date==='live'?'当前台账 · 工作预览':`BL-${date.replaceAll('-','')} · ${date} 10:00 UTC+8`;
  function coveragePage(kind){
    const sets=Object.fromEntries(Object.keys(labels).map(k=>[k,reconciliation(k,date)]));
    const rows=reportRows(kind),all=sets[kind],c=count(all);
    const tabs=Object.keys(labels).map(k=>`<a href="#coverage/${k}" ${k===kind?'aria-current="page"':''}>${labels[k]}明细</a>`).join('');
    const pass=Object.values(sets).every(set=>set.length && count(set).covered>=0.8*set.length);
    const decision=`${admin() && date!=='live'?'平台验收':'范围测算'} · ${pass?'两项均已达标':'两项尚未同时达标'}`;
    const selectDate=select('基线 / 统计日','baseline',[[latest,`${latest} · 盘点快照`],[prior,`${prior} · 盘点快照`],['live','当前台账 · 工作预览']],date,'onchange="Inventory.changeDate(this.value)"');
    const rule=kind==='machines'?'分母包含在役物理机和 VM，按机器编号去重。有已核验的 Node 运行关系或宿主承载关系计入分子。':'分母按在役业务系统编号去重。至少一条已核验的部署实例关系计入分子，跨集群部署仍只计一次。';
    return crumb('coverage/'+kind,'覆盖率对账')+heading('拓扑覆盖率对账',`${scopeName()} · ${baselineLabel()}`,selectDate)+notice()+
      panel('双 80% 目标',`<div class="pair">${coverageCard('machines',sets.machines)}${coverageCard('systems',sets.systems)}</div><p class="note foot">${e(decision)}。${R().admin()?'':'仅计算 prod-east/agent-a 可见的资产与证据。'}</p>`)+
      `<nav class="tabs" aria-label="对账对象">${tabs}</nav>`+panel(`${labels[kind]}逐项对账`,`<p>${rule}</p><p class="note foot">分母 ${c.total} · 已覆盖 ${c.covered} · 缺口 ${c.total-c.covered}</p><div class="foot">${filterForm(statusOptions,'编号、名称、关系或目标')}</div><p class="note foot">匹配 ${rows.length} 条</p>`+tbl(['资产 / 编号','结论','关系与来源','核验时间（UTC+8）'],rows.map(r=>[link(kind,r.id,r.name)+`<small>${e(r.id)}</small>`,`<span class="${r.covered?'ok':'warn'}">${r.covered?'已覆盖':e(r.reason)}</span>`,e(r.detail)+`<small>${e(r.source)}</small>`,e(r.time)]),'当前筛选下没有对账条目。'),btn('导出当前明细 CSV','exportCsv()',false,rows.length?'':'disabled'));
  }
  function changeDate(value){if(![prior,latest,'live'].includes(value)) return;date=value;message='';R().refresh();}
  function exportCsv(){
    syncRole();const [base,kind]=path();if(base!=='coverage' || !Object.hasOwn(labels,kind)) return;
    const rows=reportRows(kind);if(!rows.length) return;
    const meta=[scopeName(),baselineLabel()];
    const fields=[['范围','基线 / 统计日','编号','名称','结论','关系','来源','核验时间（UTC+8）'],...rows.map(r=>[...meta,r.id,r.name,r.covered?'已覆盖':r.reason,r.detail,r.source,r.time])];
    const quote=v=>`"${String(v).replace(/^(?=[=+@\-\t\r])/,"'").replaceAll('"','""')}"`;
    R().download(`coverage-${kind}-${date}-${admin()?'platform':'mine'}.csv`,'\uFEFF'+fields.map(row=>row.map(quote).join(',')).join('\r\n'),'text/csv;charset=utf-8');
    message=`已导出当前筛选的 ${rows.length} 条对账明细。`;R().refresh();
  }
  function render(parts){
    syncRole();const next=parts.join('/');if(next!==route){route=next;resetView();if(nextMessage?.route===route) message=nextMessage.text;nextMessage=null;}
    const [kind,id]=parts;if(parts.length===2 && kind==='coverage' && Object.hasOwn(labels,id)) return coveragePage(id);
    if(!Object.hasOwn(labels,kind) || parts.length>2 || (parts.length===2 && !id)) return missing;
    const row=id?scoped(kind).find(r=>r.asset_id===id):null;if(id && !row) return missing;
    if(admin()){
      if((mode==='create' && !id) || (mode==='edit' && row)) return formPage(kind,row);
      if(kind==='machines' && !id && mode==='import') return importPage();
      if(kind==='machines' && !id && mode==='batches') return batchesPage();
    }
    if(!id) return ledger(kind);
    return kind==='machines'?machineDetail(row):systemDetail(row);
  }
  return {render,coverage,unclustered,clusterCounts,open,filter,clearSearch,addRelation,removeRelation,hostFields,saveRecord,verify,
    sample,loadCsv,invalidateCsv,previewCsv,commitCsv,lookupBatch,changeDate,exportCsv};
})();

</script>

<script>
window.Cluster = (() => {

    }));

    ['order-api','订单服务','APP-001',east,'orders',[a],'应用'],
    ['billing-system','计费系统','SYS-002',east,'billing',[b],'业务系统','#systems/SYS-002'],
    ['billing-api','计费服务','APP-002',east,'billing',[b],'应用'],
    ['shared-pg','共享数据库','DB-001',east,'shared-data',[a,b],'数据库'],

    ['east-host','订单工作节点','SRV-001',east,'',[a],'物理机','#machines/SRV-001'],
    ['stage-api','预发服务','APP-003',west,'staging',[w],'应用'],
    ['stage-worker','预发工作节点','NODE-002',west,'',[w],'K8s Node'],
    ['stage-host','工作节点 004','SRV-004',west,'',[w],'物理机','#machines/SRV-004'],
    ['worker-spare','备用物理机','SRV-019','standalone','',[],'物理机','#machines/SRV-019'],

  const layers = {all:'全部关系',business:'业务依赖',deploy:'运行部署',physical:'物理承载'};
  const edges = [
    ['orders-system','order-api','business','包含','业务系统台账',[a]],

  function graph(clusters) {
    const targets = new Map(clusters.flatMap(c=>c.sources.map(s=>[s.target,s])));
    const observed = (n,t) => targets.has(t) && (!n.ns || targets.get(t).ns.includes(n.ns));
    const visible = new Map(nodes.filter(n=>n.cluster === 'standalone' ? Review.admin() : n.sources.some(t=>observed(n,t))).map(n=>[n.id,n]));
    const relations = [];
    for (const edge of edges) {
      const from = visible.get(edge.from), to = visible.get(edge.to);
      if (!from || !to) continue;
      const providers = edge.sources.filter(t=>observed(from,t) && observed(to,t)).map(t=>targets.get(t));
      if (edge.sources.length && !providers.length) continue;
      relations.push({...edge,from,to,providers});
    }
    return {nodes:visible, edges:relations, targets};
  }

  function assess(d,clusters) {
    const slug = /^[a-z0-9](?:[a-z0-9-]{0,61}[a-z0-9])?$/;
    const reserved = ['platform','clusters','topology','monitor','inspection','machines','systems','diagnose','coverage','all','standalone','audit','dashboard','import'];
    if (!slug.test(d.id) || reserved.includes(d.id)) throw Error('集群路由标识需为可用的小写字母、数字或短横线组合。');
    if (!/^[A-Za-z0-9][A-Za-z0-9-]{0,63}$/.test(d.asset)) throw Error('请填写稳定资产编号，如 CLS-003。');
    const parts = d.target.split('/');
    if (parts.length !== 2 || !parts.every(x=>slug.test(x))) throw Error('访问来源采用目标/实例格式，如 lab-north/agent-d。');
    const ns = unique(d.ns.split(/[\s,，、]+/).filter(Boolean));
    if (!ns.length || ns.some(n=>!slug.test(n) || n==='all')) throw Error('请填写可读命名空间，多个用逗号分隔。all 为范围选择保留字。');
    const cluster = clusters.find(c=>c.asset===d.asset);
    if (clusters.some(c=>c.id===d.id && c.asset!==d.asset)) throw Error('此路由标识已分配给其他稳定资产编号。请核对编号或更换标识。');
    const owner = clusters.find(c=>c.sources.some(s=>s.target===d.target));
    if (owner && owner!==cluster) throw Error('此来源已归属其他集群，请核对稳定资产编号。');
    const source = owner?.sources.find(s=>s.target===d.target);
    if (source && !source.online) throw Error('来源离线，无法生成发现预览。最近核验记录仍可查看。');
    return {cluster,source,ns,summary:source?'更新已有来源':cluster?'合并到已有集群':'登记新集群'};
  }
  function discoveryForm() {

  }
  const timestamp = () => new Date().toLocaleString('sv-SE',{timeZone:'Asia/Shanghai'});
  function commitDiscovery() {
    const data = raw(), draft = discovery.draft;

      const oldPreview = discovery.preview;
      if (summary !== oldPreview.summary || (source && JSON.stringify(source)!==JSON.stringify(oldPreview.source))) throw Error('来源状态已变化，请核对后重新预览。');
      const entry = cluster || {id:draft.id,asset:draft.asset,sources:[]};
      if (!cluster) data.push(entry);

      else entry.sources.push({target:draft.target,ns,online:true,at:timestamp()});
      Review.save(store,data);
