apiVersion: doops.sh/v2
kind: DeploymentTemplate
metadata:
  name: oilan-agent-reconciliation
  description: Reconcile one immutable Oilan doops agent release
spec:
  parameters:
    releaseId:
      required: true
  application: doops-agent
  release:
    source:
      repository: https://github.com/l8ai-cn/doops.git
      revision: ${inputs.releaseId}
      branch: main
  environment: oilan
  configurationSource: backend/deploy/environments.yaml
