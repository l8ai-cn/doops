image:
  repository: ""
  tag: latest
  digest: ""
  pullPolicy: Always

workload:
  name: ""
  selectorLabels:
    app: doops-agent

imagePullSecrets: []

serviceAccount:
  # Empty keeps the namespace default ServiceAccount.
  name: ""

rbac:
  # Explicitly manage a dedicated ServiceAccount and its cluster-admin binding.
  # Requires kubeconfig.source=serviceAccount and serviceAccount.name.
  create: false

kubeconfig:
  # mounted: /root/.kube/config comes from a volume.
  # serviceAccount: the entrypoint writes it from the Pod ServiceAccount token.
  source: mounted

gateway:
  url: ""
  cluster: ""
  instance: ""
  # Optional Secret holding this target's enrollment token. Empty keeps the
  # existing open registration. After the Agent connects with the token, later
  # connections to this target must present it.
  enrollmentTokenSecret: ""
  enrollmentTokenKey: token

proxy:
  # Empty rejects every public proxy upstream until an operator explicitly allows one.
  allowedHosts: ""

commandDenyRules: []

nodeSelector: {}

tolerations: []

hostAliases: []

# Enter the node that runs this Pod. Default true shares the node PID
# namespace and mounts the node root read-only at /host. Set false to keep
# the Pod in its own PID namespace. hostNetwork stays off. Gateway exec
# grants and audit still control the nsenter command.
hostAccess:
  enabled: true

volumeMounts: []

volumes: []
