apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ required "workload.name is required" .Values.workload.name }}
  namespace: {{ .Release.Namespace }}
  labels:
    app: doops-agent
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app: doops-agent
  template:
    metadata:
      labels:
        app: doops-agent
    spec:
      dnsPolicy: ClusterFirst
      nodeSelector:
{{ toYaml .Values.nodeSelector | indent 8 }}
      imagePullSecrets:
{{ toYaml .Values.imagePullSecrets | indent 8 }}
      containers:
        - name: doops-agent
          image: {{ printf "%s@%s" (required "image.repository is required" .Values.image.repository) (required "image.digest is required" .Values.image.digest) | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            privileged: true
          command:
            - /bin/sh
            - -lc
            - >-
              exec /app/sandbox-entrypoint.sh
              -listen "0.0.0.0"
              -gateway-url "$DOOPS_GATEWAY_URL"
              -cluster "$DOOPS_GATEWAY_CLUSTER"
              -instance "$DOOPS_GATEWAY_INSTANCE"
              -agent-token "$DOOPS_GATEWAY_AGENT_TOKEN"
          env:
            - name: DOOPS_GATEWAY_URL
              value: {{ .Values.gateway.url | quote }}
            - name: DOOPS_GATEWAY_CLUSTER
              value: {{ .Values.gateway.cluster | quote }}
            - name: DOOPS_GATEWAY_INSTANCE
              value: {{ .Values.gateway.instance | quote }}
            - name: DOOPS_GATEWAY_AGENT_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.gateway.agentTokenSecret.name }}
                  key: {{ .Values.gateway.agentTokenSecret.key }}
            - name: KUBECONFIG
              value: /root/.kube/config
            - name: DO_AGENT_PORT
              value: "9000"
            - name: DO_AGENT_URL
              value: http://127.0.0.1:9000
            - name: DO_AGENT_MODEL_ROUTING_POLICY
              value: {{ required "modelRouting.policy is required" .Values.modelRouting.policy | quote }}
          ports:
            - name: api
              containerPort: 42222
              protocol: TCP
          startupProbe:
            exec:
              command:
                - /bin/sh
                - -lc
                - >-
                  test "$(pgrep -fc '^/app/doops-agent( |$)' || true)" = "1"
                  && curl -fsS --max-time 1 http://127.0.0.1:42222/health/live >/dev/null
            failureThreshold: 40
            periodSeconds: 5
            timeoutSeconds: 2
          readinessProbe:
            exec:
              command:
                - /bin/sh
                - -lc
                - >-
                  test "$(pgrep -fc '^/app/doops-agent( |$)' || true)" = "1"
                  && curl -fsS --max-time 1 http://127.0.0.1:42222/health/ready >/dev/null
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 2
          livenessProbe:
            exec:
              command:
                - /bin/sh
                - -lc
                - >-
                  test "$(pgrep -fc '^/app/doops-agent( |$)' || true)" = "1"
                  && curl -fsS --max-time 1 http://127.0.0.1:42222/health/live >/dev/null
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 2
          volumeMounts:
{{ toYaml .Values.volumeMounts | indent 12 }}
      volumes:
        - name: doagent-config
          secret:
            secretName: {{ required "doagentSettings.secretName is required" .Values.doagentSettings.secretName }}
            items:
              - key: {{ required "doagentSettings.key is required" .Values.doagentSettings.key }}
                path: settings.json
{{ toYaml .Values.volumes | indent 8 }}
