image:
  repository: docker.cnb.cool/l8ai/ai/doops.sh
  tag: ""
  pullPolicy: Always

workload:
  name: doops-agent-live

modelRouting:
  policy: single-model

imagePullSecrets:
  - name: doops-registry-pull

gateway:
  url: https://doops.l8ai.cn
  cluster: doops-edu
  instance: edu-coder
  agentTokenSecret:
    name: doops-agent-runtime
    key: agent-token

nodeSelector:
  kubernetes.io/hostname: 192.168.0.24

agentSettings:
  secretName: doops-agent-settings
  key: settings.json

doagentConfig:
  configMapName: doagent-config

registryAuth:
  secretName: doops-registry-auth
  key: config.json

paths:
  kubeconfig: /etc/kubernetes/admin.conf
  agentHome: /var/lib/doops-agent-home
  containerdSocket: /run/containerd/containerd.sock
  nerdctl: /usr/bin/nerdctl
  nerdctlReal: /usr/local/bin/nerdctl.real
  crictl: /usr/bin/crictl
