apiVersion: batch/v1
kind: Job
metadata:
  name: doops-zy-046-cutover-r3
  namespace: default
  labels:
    app.kubernetes.io/name: doops-self-upgrade
spec:
  backoffLimit: 0
  activeDeadlineSeconds: 2400
  ttlSecondsAfterFinished: 604800
  template:
    spec:
      restartPolicy: Never
      nodeName: cluster-node0014.172.16.50.239
      automountServiceAccountToken: false
      hostNetwork: false
      imagePullSecrets:
        - name: aiedulab-regcred
      containers:
        - name: controller
          image: docker.cnb.cool/l8ai/ai/doops.sh@sha256:9b7435cb01c71bd7290b9f7c3b604455e0b28dac2f6a28d5433ddf0aaad5bd11
          imagePullPolicy: IfNotPresent
          command: ["python3", "/release/cutover.py"]
          env:
            - name: KUBECONFIG
              value: /root/.kube/config
          volumeMounts:
            - name: release
              mountPath: /release
              readOnly: true
            - name: root-kube
              mountPath: /root/.kube
              readOnly: true
      volumes:
        - name: release
          configMap:
            name: doops-zy-046-assets-r3
        - name: root-kube
          hostPath:
            path: /root/.kube
            type: Directory
