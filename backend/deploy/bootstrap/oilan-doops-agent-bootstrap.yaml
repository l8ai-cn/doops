apiVersion: batch/v1
kind: Job
metadata:
  generateName: doops-agent-helm-bootstrap-
  namespace: doops-system
  labels:
    app: doops-agent-bootstrap
    doops.sh/release-id: __DOOPS_AGENT_IMAGE_TAG__
spec:
  backoffLimit: 0
  ttlSecondsAfterFinished: 600
  template:
    metadata:
      labels:
        app: doops-agent-bootstrap
    spec:
      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet
      nodeSelector:
        kubernetes.io/hostname: gpu-ampere01
      imagePullSecrets:
        - name: doops-registry-pull
      restartPolicy: Never
      initContainers:
        - name: adopt-helm-label
          image: __DOOPS_AGENT_IMAGE__
          imagePullPolicy: Always
          command: ["/usr/local/bin/kubectl"]
          args:
            - -n
            - doops-system
            - label
            - deployment/doops-agent
            - app.kubernetes.io/managed-by=Helm
            - --overwrite
          env:
            - name: KUBECONFIG
              value: /root/.kube/config
          volumeMounts:
            - name: k3s-kubeconfig
              mountPath: /root/.kube/config
              readOnly: true
        - name: adopt-helm-release-name
          image: __DOOPS_AGENT_IMAGE__
          imagePullPolicy: Always
          command: ["/usr/local/bin/kubectl"]
          args:
            - -n
            - doops-system
            - annotate
            - deployment/doops-agent
            - meta.helm.sh/release-name=doops-agent
            - --overwrite
          env:
            - name: KUBECONFIG
              value: /root/.kube/config
          volumeMounts:
            - name: k3s-kubeconfig
              mountPath: /root/.kube/config
              readOnly: true
        - name: adopt-helm-release-namespace
          image: __DOOPS_AGENT_IMAGE__
          imagePullPolicy: Always
          command: ["/usr/local/bin/kubectl"]
          args:
            - -n
            - doops-system
            - annotate
            - deployment/doops-agent
            - meta.helm.sh/release-namespace=doops-system
            - --overwrite
          env:
            - name: KUBECONFIG
              value: /root/.kube/config
          volumeMounts:
            - name: k3s-kubeconfig
              mountPath: /root/.kube/config
              readOnly: true
      containers:
        - name: helm-bootstrap
          image: __DOOPS_AGENT_IMAGE__
          imagePullPolicy: Always
          command: ["/usr/local/bin/helm"]
          args:
            - upgrade
            - --install
            - doops-agent
            - /app/deploy/helm/doops-agent
            - --namespace
            - doops-system
            - --values
            - /app/deploy/environments/oilan-values.yaml
            - --set-string
            - image.tag=__DOOPS_AGENT_IMAGE_TAG__
            - --wait
            - --timeout
            - 10m
          env:
            - name: KUBECONFIG
              value: /root/.kube/config
          volumeMounts:
            - name: k3s-kubeconfig
              mountPath: /root/.kube/config
              readOnly: true
      volumes:
        - name: k3s-kubeconfig
          hostPath:
            path: /etc/rancher/k3s/k3s.yaml
            type: File
