artifactContract:
  type: image-set
  sourceRepository: https://github.com/l8ai-cn/doops.git
  sourceBranch: main
  services:
    - doops-agent
  imageTagPattern: "^[0-9a-f]{40}$"
  imageReferenceFormat: repository@digest
verificationProfiles:
  doops-agent-production:
    requiredEvidence:
      - source-identity
      - image-set
      - gitops-render
      - runtime-state
      - authorization-state
      - public-contract
      - post-deploy-log-scan
      - release-manifest
environments:
  oilan:
    target:
      name: gw-edu-coder
      cluster: doops-edu
      instance: edu-coder
    executor:
      type: helm
      config:
        namespace: kz-ops
        release: doops-agent-live
        workload: deployment/doops-agent-live
        container: doops-agent
        registry: docker.cnb.cool/l8ai/ai
        releaseManifestRepository: https://github.com/l8ai-cn/doops.git
        chart: backend/deploy/helm/doops-agent
        values: backend/deploy/environments/oilan-values.yaml
        imageBindings:
          doops-agent: image
        healthChecks:
          public:
            - id: gateway-health
              url: https://doops.l8ai.cn/health
              expectedStatus: 200
        authz:
          appCode: DOOPS
          environmentCode: OILAN
    verificationProfile: doops-agent-production
