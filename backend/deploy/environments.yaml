artifactContract:
  sourceRepository: https://github.com/l8ai-cn/doops.git
  sourceBranch: main
  services:
    - doops-agent
  imageTagPattern: "^[0-9a-f]{40}$"
  imageReferenceFormat: repository@digest
  helmImageBindings:
    doops-agent: image
  authz:
    policyScope:
      - cluster
      - instance
      - service
environments:
  oilan:
    target: gw-edu-coder
    cluster: doops-edu
    instance: edu-coder
    namespace: kz-ops
    release: doops-agent-live
    workload: deployment/doops-agent-live
    container: doops-agent
    modelRouting:
      policy: single-model
    modelSettings:
      provider: minimax
      model: minimax/MiniMax-M3
      secretRef:
        name: doagent-model-settings
        key: settings.json
    registry: docker.cnb.cool/l8ai/ai
    releaseManifestRepository: https://github.com/l8ai-cn/doops.git
    chart: backend/deploy/helm/doops-agent
    values: backend/deploy/environments/oilan-values.yaml
    deploymentMode: control-plane
    healthChecks:
      public:
        - id: gateway-health
          url: https://doops.l8ai.cn/health
          expectedStatus: 200
      workloads: []
    authz:
      appCode: DOOPS
      environmentCode: OILAN
