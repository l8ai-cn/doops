apiVersion: doops.sh/v1
kind: Workflow
metadata:
  name: oilan-doops-agent-bootstrap
spec:
  inputs:
    releaseId:
      required: true
  policy:
    agentNative: true
    maxToolScripts: 0
    requiredDocSections:
      - Inputs
      - Deployment
      - Rollback
      - Verification
  source:
    path: /tmp/doops-cicd/oilan-doops-agent/${inputs.releaseId}
    repo: https://github.com/l8ai-cn/doops.git
    branch: main
    requireCleanCommit: true
  environments:
    - name: oilan
      target: gw-oilan-node
      namespace: doops-system
      release: doops-agent
      deploymentDoc: backend/deploy/docs/oilan-doops-agent.md
      services:
        - doops-agent
  locks:
    - key: oilan-doops-agent-bootstrap
      wait: true
      cancelWaiting: true
      cancelRunning: false
  buildEnv:
    registryAuthPath: /root/.docker/config.json
    buildkitAddress: unix:///run/buildkit/buildkitd.sock
    baseImage: docker.cnb.cool/l8ai/ai/doops.sh/base-light:${inputs.releaseId}
    appImage: docker.cnb.cool/l8ai/ai/doops.sh:${inputs.releaseId}
  stages:
    - id: clone-release-source
      uses: git.clone
    - id: verify-release-source
      uses: agent.task
      with:
        task: verify-release-source
        releaseId: ${inputs.releaseId}
        branch: main
    - id: build-candidate-image
      uses: agent.task
      mutates: true
      confirm: true
      with:
        task: run-versioned-build-tool
        dryRunVerificationCommand: >-
          test -f backend/Dockerfile.base.light &&
          test -f backend/Dockerfile &&
          test -s /root/.docker/config.json &&
          buildctl --version
        requiredCommand: |
          set -e
          BASE_IMAGE=docker.cnb.cool/l8ai/ai/doops.sh/base-light:${inputs.releaseId}
          APP_IMAGE=docker.cnb.cool/l8ai/ai/doops.sh:${inputs.releaseId}
          buildctl build \
            --frontend dockerfile.v0 \
            --local context=backend \
            --local dockerfile=backend \
            --opt filename=Dockerfile.base.light \
            --output type=image,name="${BASE_IMAGE}",push=true
          buildctl build \
            --frontend dockerfile.v0 \
            --local context=backend \
            --local dockerfile=backend \
            --opt filename=Dockerfile \
            --opt build-arg:DOOPS_AGENT_BASE_IMAGE="${BASE_IMAGE}" \
            --output type=image,name="${APP_IMAGE}",push=true
        verificationCommand: |
          set -e
          APP_IMAGE=docker.cnb.cool/l8ai/ai/doops.sh:${inputs.releaseId}
          nerdctl pull "${APP_IMAGE}"
          nerdctl run --rm --entrypoint /bin/sh "${APP_IMAGE}" -lc '
            python3 -c "import yaml"
            helm version --short
            /app/doops-agent -help >/dev/null
            /usr/local/bin/do-agent --help >/dev/null
            test -f /app/deploy/helm/doops-agent/Chart.yaml
          '
    - id: bootstrap-helm-release
      uses: agent.task
      mutates: true
      confirm: true
      with:
        task: run-versioned-deploy-command
        dryRunVerificationCommand: >-
          test -f backend/deploy/bootstrap/oilan-doops-agent-bootstrap.yaml &&
          grep -q '__DOOPS_AGENT_IMAGE__' backend/deploy/bootstrap/oilan-doops-agent-bootstrap.yaml &&
          grep -q '__DOOPS_AGENT_IMAGE_TAG__' backend/deploy/bootstrap/oilan-doops-agent-bootstrap.yaml &&
          kubectl version --client=true
        requiredCommand: |
          set -e
          RELEASE_ID=${inputs.releaseId}
          APP_IMAGE=docker.cnb.cool/l8ai/ai/doops.sh:${inputs.releaseId}
          sed \
            -e "s|__DOOPS_AGENT_IMAGE__|${APP_IMAGE}|g" \
            -e "s|__DOOPS_AGENT_IMAGE_TAG__|${RELEASE_ID}|g" \
            backend/deploy/bootstrap/oilan-doops-agent-bootstrap.yaml |
            kubectl apply -f -
        verificationCommand: |
          set -e
          RELEASE_ID=${inputs.releaseId}
          APP_IMAGE=docker.cnb.cool/l8ai/ai/doops.sh:${inputs.releaseId}
          JOB_NAME="$(kubectl -n doops-system get jobs \
            -l app=doops-agent-bootstrap,doops.sh/release-id="${RELEASE_ID}" \
            --sort-by=.metadata.creationTimestamp \
            -o jsonpath='{.items[-1:].metadata.name}')"
          test -n "${JOB_NAME}"
          kubectl -n doops-system wait --for=condition=complete "job/${JOB_NAME}" --timeout=10m
          kubectl -n doops-system get secret -l owner=helm,name=doops-agent,status=deployed -o name | grep -q .
          kubectl -n doops-system rollout status deployment/doops-agent --timeout=10m
          test "$(kubectl -n doops-system get deployment doops-agent -o jsonpath='{.spec.template.spec.containers[0].image}')" = "${APP_IMAGE}"
