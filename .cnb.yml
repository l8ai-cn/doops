# Temporary policy: CNB main CI verifies source changes and publishes the
# approved date-versioned agent images. Deployment, rollback, and all CD remain
# owned by DoOps.
main:
  pull_request:
    - name: ai-review
      stages:
        - name: AI code review
          image: cnbcool/code-review:latest
          settings:
            comment: true
            max_comments: 10
            fail_on_critical: false
    - name: ci-contracts
      runner:
        cpus: 2
      docker:
        image: golang:1.24-alpine
      stages:
        - name: prepare tools
          script: apk add --no-cache bash git helm nodejs npm python3 py3-pytest py3-yaml
        - name: release contract tests
          script: python3 -m pytest backend/test -q
  push:
    - name: ci
      runner:
        cpus: 4
      services:
        - docker
      docker:
        image: golang:1.24-alpine
      env:
        RELEASE_VERSION: "20260712"
      stages:
        - name: prepare tools
          script: apk add --no-cache bash docker-cli git helm nodejs npm python3 py3-pytest py3-yaml
        - name: release contract tests
          script: python3 -m pytest backend/test -q
        - name: agent tests
          script: |
            cd backend/agent
            go test ./...
        - name: gateway tests
          script: |
            cd backend/gateway
            go test ./...
        - name: cli tests
          script: |
            cd backend/skills/doops-cli
            go test ./...
        - name: web build
          script: |
            npm i -g pnpm@11.7.0
            pnpm install --frozen-lockfile
            pnpm exec tsc --noEmit
            pnpm build
        - name: build and publish base-light image
          script: |
            BASE_IMAGE="${CNB_DOCKER_REGISTRY}/${CNB_REPO_SLUG_LOWERCASE}/base-light:${RELEASE_VERSION}"
            BASE_IMAGE_REVISION="${CNB_DOCKER_REGISTRY}/${CNB_REPO_SLUG_LOWERCASE}/base-light:${RELEASE_VERSION}-${CNB_COMMIT_SHORT}"
            docker build \
              --label org.opencontainers.image.revision="${CNB_COMMIT}" \
              --label org.opencontainers.image.version="${RELEASE_VERSION}" \
              -f backend/Dockerfile.base.light \
              -t "${BASE_IMAGE}" \
              -t "${BASE_IMAGE_REVISION}" \
              backend
            docker push "${BASE_IMAGE}"
            docker push "${BASE_IMAGE_REVISION}"
        - name: build and publish doops agent image
          script: |
            BASE_IMAGE_REVISION="${CNB_DOCKER_REGISTRY}/${CNB_REPO_SLUG_LOWERCASE}/base-light:${RELEASE_VERSION}-${CNB_COMMIT_SHORT}"
            APP_IMAGE="${CNB_DOCKER_REGISTRY}/${CNB_REPO_SLUG_LOWERCASE}:${RELEASE_VERSION}"
            APP_IMAGE_REVISION="${CNB_DOCKER_REGISTRY}/${CNB_REPO_SLUG_LOWERCASE}:${RELEASE_VERSION}-${CNB_COMMIT_SHORT}"
            docker build \
              --build-arg DOOPS_AGENT_BASE_IMAGE="${BASE_IMAGE_REVISION}" \
              --label org.opencontainers.image.revision="${CNB_COMMIT}" \
              --label org.opencontainers.image.version="${RELEASE_VERSION}" \
              -f backend/Dockerfile \
              -t "${APP_IMAGE}" \
              -t "${APP_IMAGE_REVISION}" \
              backend
            docker push "${APP_IMAGE}"
            docker push "${APP_IMAGE_REVISION}"

master:
  pull_request:
    - name: ai-review
      stages:
        - name: AI code review
          image: cnbcool/code-review:latest
          settings:
            comment: true
            max_comments: 10
